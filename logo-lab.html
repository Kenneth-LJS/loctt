/* --------------------------------------------------------------------
   CUBIC BEZIER SEGMENTS

   Each segment is a real cubic bezier with control points placed by the
   handles. Because x is also a bezier (not linear), we solve x(s) = u
   for the curve parameter s, then read y(s). That is exactly what CSS
   cubic-bezier() does, so the preview and the exported CSS agree.
-------------------------------------------------------------------- */

const clamp01 = t => Math.max(0, Math.min(1, t));

const bez1 = (s, p0, p1, p2, p3) => {
  const m = 1 - s;
  return m*m*m*p0 + 3*m*m*s*p1 + 3*m*s*s*p2 + s*s*s*p3;
};

/** Solve a cubic bezier's y for a given x, with x1/x2 the handle x's. */
function bezYatX(u, x1, y1, x2, y2) {
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  // Newton, falling back to bisection -- x is monotonic for x1,x2 in 0..1
  let s = u;
  for (let i = 0; i < 8; i++) {
    const x = bez1(s, 0, x1, x2, 1) - u;
    if (Math.abs(x) < 1e-7) break;
    const d = 3*(1-s)*(1-s)*x1 + 6*(1-s)*s*(x2 - x1) + 3*s*s*(1 - x2);
    if (Math.abs(d) < 1e-9) break;
    s -= x / d;
    s = clamp01(s);
  }
  let lo = 0, hi = 1;
  if (Math.abs(bez1(s, 0, x1, x2, 1) - u) > 1e-6) {
    for (let i = 0; i < 40; i++) {
      s = (lo + hi) / 2;
      (bez1(s, 0, x1, x2, 1) < u) ? lo = s : hi = s;
    }
  }
  return bez1(s, 0, y1, y2, 1);
}

/**
 * Evaluate keyframes at time t.
 * Keys: { t, v, outX, outY, inX, inY } -- handles in segment-local
 * fractions, so one number means the same thing on any segment length.
 */
function keysAt(keys, t) {
  if (t <= keys[0].t) return keys[0].v;
  const last = keys[keys.length - 1];
  if (t >= last.t) return last.v;
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t >= a.t && t <= b.t) {
      const u = (t - a.t) / Math.max(1e-9, b.t - a.t);
      const dv = b.v - a.v;
      if (Math.abs(dv) < 1e-12) return a.v;      // flat segment
      // The in-handle is measured BACK from the arriving key: its x is
      // how far back along the segment, its y how far the curve is
      // pulled beyond the endpoint. Writing y2 = 1 - inY inverted that
      // (inY 1.18 became -0.18, dipping before the end instead of
      // overshooting past it, and dragging the first segment to -25.76
      // instead of the -22 asked for). y2 = 1 + inY is the offset form.
      const f = bezYatX(u,
        clamp01(a.outX ?? 1/3), (a.outY ?? 0),
        clamp01(1 - (b.inX ?? 1/3)), 1 + (b.inY ?? 0));
      return a.v + dv * f;
    }
  }
  return last.v;
}

/**
 * The animation state at clock position t (0..1). Rotation and
 * separation are independent three-key curves; `rest` appends still
 * time after the motion rather than compressing it.
 */
function animAt(t) {
  const A = ANIM;
  const span = 1 / (1 + Math.max(0, A.rest || 0));
  const tm = clamp01(t / span);
  // Whole turns only: a fraction leaves the mark facing a different way
  // than it started. Rounded here too, so a stale saved config cannot
  // reintroduce it.
  const end = Math.round(A.turns) * 360;

  // Rotation: 0 -> wind-up -> overshoot -> end. The overshoot is a real
  // key with y = 0 handles, so it lands exactly like the wind-up does,
  // rather than being whatever an end handle happened to produce.
  const rot = keysAt([
    { t: 0,        v: 0,              outX: A.rStartHX, outY: A.rStartHY },
    { t: A.rPeakT, v: A.rPeakV,       inX: A.rPeakIn, inY: 0,
                                      outX: A.rPeakOut, outY: 0 },
    { t: A.rOverT, v: end + A.rOverV, inX: A.rOverIn, inY: 0,
                                      outX: A.rOverOut, outY: 0 },
    { t: 1,        v: end,            inX: A.rEndHX, inY: 0 },
  ], tm);

  // Separation: 0 -> full -> 0.
  const sep = keysAt([
    { t: 0,        v: 0,          outX: A.sStartHX, outY: A.sStartHY },
    { t: A.sPeakT, v: A.sPeakV,   inX: A.sPeakIn, inY: 0,
                                  outX: A.sPeakOut, outY: 0 },
    { t: 1,        v: 0,          inX: A.sEndHX, inY: 0 },
  ], tm);

  const k = A.spread * sep / Math.SQRT2;
  return { rot, lx: -k, ly: k, sx: k, sy: -k };
}

let animRAF = null, animT0 = 0, animLoop = false;

/**
 * Size the animation viewBox to the worst case over the WHOLE timeline,
 * not the current frame -- otherwise the box would breathe as the mark
 * separates and the preview would appear to zoom. Recomputed when the
 * separation or rotation settings change.
 */
function fitAnimView() {
  let worst = 0;
  for (let i = 0; i <= 120; i++) {
    const a = animAt(i / 120), rad = a.rot * Math.PI / 180;
    for (const [ox, oy] of [[a.lx, a.ly], [a.sx, a.sy]])
      for (const [x, y] of [[0,0],[1,0],[1,1],[0,1]]) {
        const px = x + ox - 0.5, py = y + oy - 0.5;
        const rx = px*Math.cos(rad) - py*Math.sin(rad) + 0.5;
        const ry = px*Math.sin(rad) + py*Math.cos(rad) + 0.5;
        worst = Math.max(worst, Math.abs(rx - 0.5), Math.abs(ry - 0.5));
      }
  }
  const half = worst + 0.06;
  $("anim").setAttribute("viewBox",
    `${(0.5-half).toFixed(3)} ${(0.5-half).toFixed(3)} ${(2*half).toFixed(3)} ${(2*half).toFixed(3)}`);
}

/* --------------------------------------------------------------------
   TIMELINE CHART

   Rotation and separation plotted against time on a shared x axis, each
   on its OWN y scale (degrees vs 0..1 are not comparable). Dotted lines
   mark the values the solver pins exactly -- the wind-back, the
   overshoot, full separation, the resting angle -- so you can see the
   curve actually touch them rather than take my word for it.

   The viewBox keeps its natural aspect ratio: stretching it with
   preserveAspectRatio="none" squashed the labels ("apart" and "spin"
   ran together as "apapstin"). Coordinates are therefore in real
   viewBox units, not percentages.
-------------------------------------------------------------------- */

const CHART = { x0: 40, x1: 386, y0: 16, y1: 116 };   // plot area in viewBox units

function drawGraph(playhead = 0) {
  const g = $("graph");
  if (!g) return;
  const A = ANIM;
  const { x0, x1, y0, y1 } = CHART;
  const N = 300;

  // sample once, derive both scales from the data so nothing clips
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = animAt(t);
    pts.push({ t, rot: a.rot, sep: Math.abs(a.lx) / Math.max(1e-9, A.spread / Math.SQRT2) });
  }
  // Include the HANDLE control points in the range, not just the curve:
  // the end handle reaches past the finish to make the overshoot, and
  // was being drawn outside the plot.
  const endV = Math.round(A.turns) * 360;
  const handleYs = [ A.rStartHY * (A.rPeakV - 0), endV + A.rOverV ];
  const rMin = Math.min(0, ...pts.map(p => p.rot), ...handleYs);
  const rMax = Math.max(1, ...pts.map(p => p.rot), ...handleYs);
  const X = t => x0 + (x1 - x0) * t;
  const Yr = v => y1 - (y1 - y0) * ((v - rMin) / Math.max(1e-6, rMax - rMin));
  const Ys = v => y1 - (y1 - y0) * v;                    // separation is 0..1

  const path = (f, key) => pts.map((p, i) =>
    `${i ? "L" : "M"}${X(p.t).toFixed(2)} ${f(p[key]).toFixed(2)}`).join("");

  const end = endV;
  const span = 1 / (1 + Math.max(0, A.rest || 0));
  const reachedPeak = Math.max(...pts.map(p => p.rot));

  // dotted guides at the solved landmark values
  // Drop a label when it would land on top of one already placed
  // (374 and 360 are only a few pixels apart); the line still draws.
  const placed = [];
  const guide = (y, label, cls) => {
    const clash = placed.some(py => Math.abs(py - y) < 10);
    if (!clash) placed.push(y);
    return `<line x1="${x0}" y1="${y.toFixed(2)}" x2="${x1}" y2="${y.toFixed(2)}"
       class="gl ${cls}"/>` +
      (clash ? "" : `<text x="${(x0 - 6).toFixed(2)}" y="${(y + 3.2).toFixed(2)}"
       class="gt ${cls}">${label}</text>`);
  };

  // Alternate the label row: adjacent beat markers can sit very close
  // (they collided as "apapstin"), so odd ones drop to a second line.
  let vi = 0;
  const vguide = (t, label) => {
    const row = (vi++ % 2) ? 25 : 14;
    return `<line x1="${X(t).toFixed(2)}" y1="${y0}" x2="${X(t).toFixed(2)}" y2="${y1}" class="gl gv"/>` +
      `<text x="${X(t).toFixed(2)}" y="${(y1 + row).toFixed(2)}" class="gt gv">${label}</text>`;
  };

  const parts = [];
  // horizontal: the pinned values
  parts.push(guide(Yr(0), "0\u00B0", "r"));
  if (A.rPeakV) parts.push(guide(Yr(A.rPeakV), `${A.rPeakV}\u00B0`, "r"));
  if (reachedPeak > end + 0.5) parts.push(guide(Yr(reachedPeak), `${reachedPeak.toFixed(0)}\u00B0`, "r"));
  parts.push(guide(Yr(end), `${end.toFixed(0)}\u00B0`, "r"));
  parts.push(guide(Ys(A.sPeakV), "apart", "s"));

  // vertical: the beat boundaries, at their real positions
  // These two are separate params and often sit close together (0.26 vs
  // 0.30 by default); label them explicitly so they do not read as one.
  parts.push(vguide(A.sPeakT * span, "sep peak"));
  parts.push(vguide(A.rPeakT * span, "rot peak"));
  if (A.rOverV > 0.5) parts.push(vguide(A.rOverT * span, "overshoot"));
  if (span < 0.999) parts.push(vguide(span, "rest"));

  // the curves
  parts.push(`<path d="${path(Ys, "sep")}" class="cv sep"/>`);
  parts.push(`<path d="${path(Yr, "rot")}" class="cv rot"/>`);

  /* ---- bezier handles ----
     Each handle is drawn from its key out to the control point it
     defines, in the same space as the curve, so what you drag is what
     you see. A handle of length 0 collapses onto its key -- which is
     exactly what a stationary peak looks like. */
  const handles = (keys, Y, cls) => {
    const out = [];
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      const ax = X(a.t * span), bx = X(b.t * span);
      const ay = Y(a.v),        by = Y(b.v);
      const dv = b.v - a.v;
      // out-handle of `a`: x fraction along the segment, y fraction of dv
      const ox = ax + (bx - ax) * clamp01(a.outX ?? 1/3);
      const oy = Y(a.v + dv * (a.outY ?? 0));
      // in-handle of `b`: measured BACK from b, y is an offset past it
      const ix = bx - (bx - ax) * clamp01(b.inX ?? 1/3);
      const iy = Y(b.v + dv * (b.inY ?? 0));
      out.push(
        `<line x1="${ax.toFixed(2)}" y1="${ay.toFixed(2)}" x2="${ox.toFixed(2)}" y2="${oy.toFixed(2)}" class="hl ${cls}"/>`,
        `<line x1="${bx.toFixed(2)}" y1="${by.toFixed(2)}" x2="${ix.toFixed(2)}" y2="${iy.toFixed(2)}" class="hl ${cls}"/>`,
        `<circle cx="${ox.toFixed(2)}" cy="${oy.toFixed(2)}" r="2.2" class="hp ${cls}"/>`,
        `<circle cx="${ix.toFixed(2)}" cy="${iy.toFixed(2)}" r="2.2" class="hp ${cls}"/>`);
    }
    // the keys themselves
    for (const k of keys)
      out.push(`<circle cx="${X(k.t * span).toFixed(2)}" cy="${Y(k.v).toFixed(2)}" r="3" class="kp ${cls}"/>`);
    return out.join("");
  };

  const rotKeys = [
    { t: 0,        v: 0,              outX: A.rStartHX, outY: A.rStartHY },
    { t: A.rPeakT, v: A.rPeakV,       inX: A.rPeakIn, inY: 0, outX: A.rPeakOut, outY: 0 },
    { t: A.rOverT, v: end + A.rOverV, inX: A.rOverIn, inY: 0, outX: A.rOverOut, outY: 0 },
    { t: 1,        v: end,            inX: A.rEndHX, inY: 0 },
  ];
  const sepKeys = [
    { t: 0,        v: 0,            outX: A.sStartHX, outY: A.sStartHY },
    { t: A.sPeakT, v: A.sPeakV,     inX: A.sPeakIn, inY: 0, outX: A.sPeakOut, outY: 0 },
    { t: 1,        v: 0,            inX: A.sEndHX, inY: 0 },
  ];
  parts.push(handles(sepKeys, Ys, "sep"));
  parts.push(handles(rotKeys, Yr, "rot"));

  // Report what the handles actually produced. The peak values are
  // landed exactly (handle y = 0 there), but the OVERSHOOT is whatever
  // the end handle's y yields -- so it is measured, not assumed.
  const out = $("animOut");
  if (out) {
    const over = reachedPeak - end;
    out.innerHTML =
      `wind-up <b>${A.rPeakV}\u00B0</b> at ${Math.round(A.rPeakT * span * A.dur)}ms` +
      ` \u00B7 apart <b>${(A.sPeakV * 100).toFixed(0)}%</b> at ${Math.round(A.sPeakT * span * A.dur)}ms` +
      ` \u00B7 overshoot <b>+${over.toFixed(1)}\u00B0</b> at ${Math.round(A.rOverT * span * A.dur)}ms` +
      ` \u00B7 settles at <b>${end.toFixed(0)}\u00B0</b>`;
  }

  // Playhead is a separate node so playback can move it without
  // rebuilding the whole chart 60 times a second.
  const px = X(clamp01(playhead));
  parts.push(`<line id="playhead" x1="${px.toFixed(2)}" y1="${y0}" x2="${px.toFixed(2)}" y2="${y1}" class="ph"/>`);

  g.innerHTML = `<style>
    .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .gl.gv { stroke-dasharray: 2 5; }
    .gt { font-size: 9px; fill: var(--dim); text-anchor: end;
          font-family: ui-monospace, Menlo, monospace; }
    .gt.s { fill: #e5a13a; }
    .gt.gv { text-anchor: middle; }
    .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
    .cv.rot { stroke: var(--accent); }
    .cv.sep { stroke: #e5a13a; }
    .ph { stroke: var(--text); stroke-width: 1.5; opacity: .9; }
    .hl { stroke-width: 1; opacity: .5; }
    .hl.rot { stroke: var(--accent); }
    .hl.sep { stroke: #e5a13a; }
    .hp { opacity: .75; }
    .hp.rot { fill: var(--accent); }
    .hp.sep { fill: #e5a13a; }
    .kp { stroke: var(--canvas); stroke-width: 1.2; }
    .kp.rot { fill: var(--accent); }
    .kp.sep { fill: #e5a13a; }
  </style>` + parts.join("");
}

/** Move just the playhead; cheap enough for every frame. */
function movePlayhead(t) {
  const ph = $("playhead");
  if (!ph) { drawGraph(t); return; }
  const x = (CHART.x0 + (CHART.x1 - CHART.x0) * clamp01(t)).toFixed(2);
  ph.setAttribute("x1", x); ph.setAttribute("x2", x);
}

function applyAnim(t) {
  const a = animAt(clamp01(t));
  $("spin").setAttribute("transform", `rotate(${a.rot.toFixed(3)} 0.5 0.5)`);
  $("aL").setAttribute("transform",  `translate(${a.lx.toFixed(4)} ${a.ly.toFixed(4)})`);
  $("aSq").setAttribute("transform", `translate(${a.sx.toFixed(4)} ${a.sy.toFixed(4)})`);
  const sc = $("scrub");
  if (document.activeElement !== sc) sc.value = t;
  movePlayhead(t);
}

function playAnim() {
  cancelAnimationFrame(animRAF);
  animT0 = performance.now();
  const step = now => {
    const t = (now - animT0) / ANIM.dur;
    if (t >= 1) {
      applyAnim(1);
      if (animLoop) { animT0 = now; animRAF = requestAnimationFrame(step); }
      return;
    }
    applyAnim(t);
    animRAF = requestAnimationFrame(step);
  };
  animRAF = requestAnimationFrame(step);
}

/* ---------- render ---------- */

const $ = id => document.getElementById(id);

/**
 * Paint a part list into a container, one <path> per part, coloured by
 * the live theme tokens. Previously the previews drew a single
 * evenodd path, so the square was a HOLE and could not take its own
 * colour -- the on-page view could not show the two-tone the exports
 * carry. Now every surface renders the same parts the same way.
 */
/**
 * One row per colour variant, every size inside it, on that variant's
 * own background. `partsAt(px)` gives the geometry for a size and
 * `widthAt(px)` its rendered width, so the same function serves the
 * square mark and the wide wordmark.
 */
function renderRows(host, partsAt, widthAt) {
  if (!host) return;
  const PAD = 0.06;                      // breathing room, as elsewhere
  const vs = VARIANTS;
  host.innerHTML = vs.map(v => {
    const cls = `on-${v.theme}`;
    const figs = SIZES.slice().reverse().map(px => {
      const parts = partsAt(px);
      const wUnits = widthAt(px) / px;   // width in unit-box terms
      const vb = `${-PAD} ${-PAD} ${(wUnits + PAD*2).toFixed(4)} ${(1 + PAD*2).toFixed(4)}`;
      const w = (px * (wUnits + PAD*2)).toFixed(1);
      const h = (px * (1 + PAD*2)).toFixed(1);
      return `<figure><svg width="${w}" height="${h}" viewBox="${vb}">` +
        parts.map(p => `<path fill="${p.part === "l" ? v.l : v.o}" d="${p.d}"/>`).join("") +
        `</svg><figcaption>${px}</figcaption></figure>`;
    }).join("");
    return `<div class="vrow ${cls}"><div class="lbl">${v.label}</div>` +
           `<div class="strip">${figs}</div></div>`;
  }).join("");
}

/**
 * An animated preview per variant, below the chart. They are rebuilt
 * only when the geometry changes; applyAnim() drives them every frame.
 */
/**
 * Drop the REAL exported SVG into each preview, rather than rebuilding
 * the animation by hand. What you watch here is byte-for-byte the file
 * the download button produces -- including its own <style> block and
 * CSS keyframes -- so the preview cannot drift from the artifact.
 *
 * Each copy needs unique keyframe names: several inline SVGs in one
 * document share a stylesheet scope, so identical @keyframes names
 * would collide and every variant would run the last one's timing.
 */
function buildAnimRows() {
  const host = $("animrows2");
  if (!host) return;
  host.innerHTML = VARIANTS.map(v => {
    // Scope BOTH the keyframe names and the class names. Inline SVGs
    // share the document's stylesheet, so four copies of `.spin` meant
    // the last <style> block won and every variant ran that one's
    // timing -- unique @keyframes alone was not enough.
    const svg = svgAnimated(64, v.k)
      .replace(/loctt-(rot|l|o)\b/g, `loctt-$1-${v.k}`)
      .replace(/\b(spin|pL|pO)\b/g, `$1-${v.k}`);
    return `<figure class="apvf on-${v.theme}">${svg}` +
           `<figcaption>${v.label}</figcaption></figure>`;
  }).join("");
}

function paintParts(host, parts) {
  if (!host) return;
  host.innerHTML = parts.map(p =>
    `<path data-part="${p.part}" fill="${p.part === "l" ? "var(--logo-accent)" : "var(--logo-ink)"}" d="${p.d}"/>`
  ).join("");
}

function render() {
  save();
  // The big preview is drawn at the REGULAR end of the scale.
  PREC = 6;
  const pReg0 = paramsAt(REG_PX);
  const big = buildPath(pReg0);
  paintParts($("mark"), markParts(pReg0));

  // animation preview uses the same geometry, split into its two pieces
  $("aL").setAttribute("d", big.dL);
  $("aSq").setAttribute("d", big.dSq || "");

  const w = buildWordmark(pReg0);
  paintParts($("wordmark"), w.parts);
  // Pad the wordmark box. At wordScale = 1 the letters fill y 0..1
  // exactly, so a tight viewBox puts their flat tops hard against the
  // panel edge and they read as chopped. The mark itself is not clipped
  // -- this is breathing room, matching the LO preview's own margin.
  const PAD = 0.06;
  $("word").setAttribute("viewBox",
    `${-PAD} ${-PAD} ${(w.width + PAD*2).toFixed(4)} ${(1 + PAD*2).toFixed(4)}`);

  // --- one ROW per colour variant, every size in it ---
  // Built from the same parts the exports use, on each variant's own
  // background, so what is shown is exactly what downloads.
  renderRows($("markrows"),
    px => markParts(paramsAt(px)),
    px => px);
  renderRows($("wordrows"),
    px => buildWordmark(paramsAt(px)).parts,
    px => buildWordmark(paramsAt(px)).width * px);

  // --- animated preview per variant, below the chart ---
  // These are self-running exported SVGs, so they are NOT driven by the
  // scrubber; they loop on their own like the real asset does.
  buildAnimRows();

  // Readouts: caps, and what the formula gives at each angle.
  const pReg = paramsAt(REG_PX);
  const lim = radiusLimits(pReg);
  const cap = Math.max(0, Math.min(0.5, lim.rSquare));
  const box = $("cap-rSquare");
  if (box) {
    const over = pReg.rSquare > cap + 1e-9;
    box.textContent = over ? `capped at ${cap.toFixed(3)}` : "";
    box.classList.toggle("warn", over);
  }

  const g = big.g;
  const info = $("derivedR");
  if (info) {
    const seen = new Map();
    g.outerPts.forEach((p, i) => {
      const deg = Math.round(interiorAngle(g.outerPts, i) * 180 / Math.PI);
      if (!seen.has(deg)) seen.set(deg, g.outerR[i]);
    });
    info.innerHTML = [...seen.entries()]
      .sort((a, b) => a[0] - b[0])
      .map(([deg, r]) => `${deg}\u00B0 r <b>${r.toFixed(3)}</b>`)
      .join(" &nbsp;\u00B7&nbsp; ");
  }

  // Export: fixed viewBox, fixed precision, regular-size parameters.
  PREC = EXPORT_PREC;
  const dMark = scalePath(buildPath(pReg0).d, EXPORT_SIZE);
  $("dout").value = dMark;
  $("svgout").value = allSvgs();
}

/**
 * Every variant, ready to paste or save: the LO mark and the full LOCTT
 * wordmark, each emitted at every size in SIZES using THAT size's own
 * interpolated parameters -- a 16px file is not the 64px file scaled
 * down, it is the small-value geometry.
 */
/* --------------------------------------------------------------------
   SVG BUILDERS

   Three deliverables, each in four colour variants. The L always takes
   the accent token and the square/letters take text-primary, matching
   how LogoMark.tsx is wired.
-------------------------------------------------------------------- */

const variantOf = k => VARIANTS.find(v => v.k === k) || VARIANTS[0];

/**
 * Which token a part takes. The L is the accent; everything else --
 * the square and each letter -- is text-primary.
 */
const fillFor = (part, v) => (part === "l" ? v.l : v.o);

/** Parts -> <path> markup. One place, so every surface agrees. */
function pathsMarkup(parts, v, indent = "  ", extra = () => "") {
  return parts.map(p =>
    `${indent}<path data-part="${p.part}"${extra(p)} fill="${fillFor(p.part, v)}" d="${p.d}"/>`
  ).join("\n");
}

/** The LO mark as parts, at a given size's parameters. */
function markParts(s) {
  const b = buildPath(s);
  return [
    { part: "l", d: b.dL },
    ...(b.dSq ? [{ part: "o", d: b.dSq }] : []),
  ];
}

/** Scale a part list in place-ish (returns a new list). */
const scaleParts = (parts, k) => parts.map(p => ({ part: p.part, d: scalePath(p.d, k) }));

/** The LO mark alone, at `px`, using that size's interpolated params. */
function svgMark(px, vk) {
  const v = variantOf(vk);
  const prev = PREC; PREC = EXPORT_PREC;
  const parts = scaleParts(markParts(paramsAt(px)), px);
  PREC = prev;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${px} ${px}" width="${px}" height="${px}">
${pathsMarkup(parts, v)}
</svg>`;
}

/** The full LOCTT wordmark, `px` tall, every glyph its own path. */
function svgWordmark(px, vk) {
  const v = variantOf(vk);
  const prev = PREC; PREC = EXPORT_PREC;
  const w = buildWordmark(paramsAt(px));
  const parts = scaleParts(w.parts, px);
  PREC = prev;
  const wd = +(w.width * px).toFixed(3);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${wd} ${px}" width="${wd}" height="${px}">
${pathsMarkup(parts, v)}
</svg>`;
}

/**
 * The wordmark with the spinner baked in: the LO's two pieces animate,
 * the CTT sit still beside them. The keyframes are the same ones the
 * Copy CSS button emits, inlined in a <style> so the file is standalone.
 */
/**
 * The MARK alone with the spinner baked in -- just the L and its
 * square, no lettering. The wordmark is a static lockup; animating the
 * CTT alongside a spinning LO reads as two competing things.
 *
 * The keyframes are the same ones the Copy CSS button emits, inlined in
 * a <style> so the file is standalone.
 */
function svgAnimated(px, vk) {
  const v = variantOf(vk);
  const A = ANIM;
  const prev = PREC; PREC = EXPORT_PREC;
  const parts = scaleParts(markParts(paramsAt(px)), px);
  PREC = prev;

  const span = 1 / (1 + Math.max(0, A.rest || 0));
  const end = Math.round(A.turns) * 360;
  const f3 = x => (+x).toFixed(3);
  const ease = (outX, outY, inX, inY) =>
    `cubic-bezier(${f3(clamp01(outX))}, ${f3(outY)}, ${f3(clamp01(1 - inX))}, ${f3(1 + inY)})`;

  const rotStops = [
    [0,         0,              ease(A.rStartHX, A.rStartHY, A.rPeakIn, 0)],
    [A.rPeakT,  A.rPeakV,       ease(A.rPeakOut, 0, A.rOverIn, 0)],
    [A.rOverT,  end + A.rOverV, ease(A.rOverOut, 0, A.rEndHX, 0)],
    [1,         end,            null],
  ];
  const off = val => f3(A.spread * val / Math.SQRT2 * px);
  const sepStops = [
    [0,        0,        ease(A.sStartHX, A.sStartHY, A.sPeakIn, 0)],
    [A.sPeakT, A.sPeakV, ease(A.sPeakOut, 0, A.sEndHX, 0)],
    [1,        0,        null],
  ];
  const emit = (stops, fmt) => {
    const rows = stops.map(([t, val, e]) =>
      `    ${(t * span * 100).toFixed(2)}% { ${fmt(val)}` +
      (e ? ` animation-timing-function: ${e};` : "") + ` }`);
    if (span < 0.999) rows.push(`    100% { ${fmt(stops[stops.length - 1][1])} }`);
    return rows.join("\n");
  };

  // The mark fills the box, so it spins about its own centre. The
  // viewBox is padded because a rotating square sweeps a larger circle
  // than the square itself -- half its diagonal, plus the separation.
  const pad = px * (Math.SQRT2 - 1) / 2 + A.spread * px * 0.75;
  const box = px + pad * 2;
  const c = f3(box / 2);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f3(-pad)} ${f3(-pad)} ${f3(box)} ${f3(box)}" width="${f3(box)}" height="${f3(box)}">
  <style>
    .spin { transform-origin: ${f3(px / 2)}px ${f3(px / 2)}px;
            animation: loctt-rot ${A.dur}ms infinite; }
    .pL   { animation: loctt-l ${A.dur}ms infinite; }
    .pO   { animation: loctt-o ${A.dur}ms infinite; }
    @keyframes loctt-rot {
${emit(rotStops, val => `transform: rotate(${f3(val)}deg);`)}
    }
    @keyframes loctt-l {
${emit(sepStops, val => `transform: translate(-${off(val)}px, ${off(val)}px);`)}
    }
    @keyframes loctt-o {
${emit(sepStops, val => `transform: translate(${off(val)}px, -${off(val)}px);`)}
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .pL, .pO { animation: none; }
    }
  </style>
  <g class="spin">
${pathsMarkup(parts, v, "    ", p => p.part === "l" ? ' class="pL"' : ' class="pO"')}
  </g>
</svg>`;
}

/** Everything, for the "all svgs" box. */
function allSvgs() {
  const out = [];
  for (const px of SIZES) out.push(`<!-- LO mark @ ${px} (tokens) -->\n` + svgMark(px, "token"));
  for (const px of SIZES) out.push(`<!-- LOCTT wordmark @ ${px} (tokens) -->\n` + svgWordmark(px, "token"));
  out.push(`<!-- LOCTT animated @ 64 (tokens) -->\n` + svgAnimated(64, "token"));
  return out.join("\n\n");
}

/** Multiply every LENGTH in a path by k (arc flags are left alone). */
function scalePath(d, k) {
  const num = x => {
    const v = Math.abs(x) < 1e-9 ? 0 : x;
    return (v.toFixed(Math.max(0, PREC)).replace(/\.?0+$/, "")) || "0";
  };
  return d.replace(/([MLA])([^MLAZ]*)/gi, (_, cmd, args) => {
    const n = (args.match(/-?\d*\.?\d+(?:e-?\d+)?/g) || []).map(parseFloat);
    if (cmd.toUpperCase() === "A") {
      const out = [];
      for (let i = 0; i + 7 <= n.length; i += 7) {
        const [rx, ry, rot, laf, sf, x, y] = n.slice(i, i + 7);
        out.push(`${num(rx*k)} ${num(ry*k)} ${rot} ${laf} ${sf} ${num(x*k)} ${num(y*k)}`);
      }
      return cmd + out.join(cmd);
    }
    return cmd + n.map(v => num(v * k)).join(" ");
  });
}

/* ---------- build the controls from FIELDS ---------- */

function buildControls() {
  for (const f of FIELDS) {
    const host = $("g-" + f.g);
    const row = document.createElement("div");
    row.className = "f";
    row.innerHTML =
      `<label for="${f.k}-reg">${f.label}</label>` +
      `<input type="number" id="${f.k}-reg" step="${f.step}" min="${f.min}" max="${f.max}">` +
      `<input type="number" id="${f.k}-sml" step="${f.step}" min="${f.min}" max="${f.max}">` +
      `<input class="sl slreg" type="range" id="${f.k}-slreg" min="${f.min}" max="${f.max}" step="${f.step}">` +
      `<input class="sl slsml" type="range" id="${f.k}-slsml" min="${f.min}" max="${f.max}" step="${f.step}">`;
    host.appendChild(row);

    const reg = $(`${f.k}-reg`), sml = $(`${f.k}-sml`);
    const slReg = $(`${f.k}-slreg`), slSml = $(`${f.k}-slsml`);

    // One slider per column, fully independent. The regular slider never
    // touches the small value -- editing one size must not silently move
    // the other.
    slReg.addEventListener("input", e => {
      S[f.k].reg = parseFloat(e.target.value);
      syncField(f); render();
    });
    slSml.addEventListener("input", e => {
      S[f.k].sml = parseFloat(e.target.value);
      syncField(f); render();
    });
    const commit = (which, el) => {
      const val = parseFloat(el.value);
      if (!isFinite(val)) { syncField(f); return; }
      S[f.k][which] = val;          // typed values are NOT clamped to the
      syncField(f);                 // slider range -- you asked for it
      render();
    };
    reg.addEventListener("change", () => commit("reg", reg));
    sml.addEventListener("change", () => commit("sml", sml));
    reg.addEventListener("keydown", e => { if (e.key === "Enter") reg.blur(); });
    sml.addEventListener("keydown", e => { if (e.key === "Enter") sml.blur(); });
  }
  const cc = $("crookConcentric");
  cc.addEventListener("change", e => { S.crookConcentric = e.target.checked; render(); });
}

function syncField(f) {
  const v = S[f.k];
  const reg = $(`${f.k}-reg`), sml = $(`${f.k}-sml`);
  const slReg = $(`${f.k}-slreg`), slSml = $(`${f.k}-slsml`);
  const dp = String(f.step).includes(".") ? String(f.step).split(".")[1].length : 0;
  if (document.activeElement !== reg) reg.value = (+v.reg.toFixed(dp));
  if (document.activeElement !== sml) sml.value = (+v.sml.toFixed(dp));
  slReg.value = Math.max(f.min, Math.min(f.max, v.reg));
  slSml.value = Math.max(f.min, Math.min(f.max, v.sml));
}

function syncAll() { for (const f of FIELDS) syncField(f); $("crookConcentric").checked = S.crookConcentric; }

/* ---------- copy buttons ---------- */

for (const [btn, ta] of [["copyd","dout"],["copysvg","svgout"]]) {
  $(btn).addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($(ta).value); }
    catch { $(ta).select(); document.execCommand("copy"); }
    const b = $(btn), old = b.textContent;
    b.textContent = "Copied"; setTimeout(() => b.textContent = old, 900);
  });
}

$("theme").addEventListener("click", e => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
  e.target.textContent = light ? "Light" : "Dark";
});

$("reset").addEventListener("click", () => {
  for (const f of FIELDS) S[f.k] = { reg: f.reg, sml: f.sml };
  S.crookConcentric = true;
  Object.assign(ANIM, ANIM_DEFAULTS);   // Reset covers the animation too
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  syncAll(); syncAnim(); fitAnimView(); render(); drawGraph(0); applyAnim(0);
});

/* ---------- animation controls ---------- */

function buildAnimControls() {
  const host = $("animrows");
  let out = "", sec = null;
  for (const f of ANIM_FIELDS) {
    if (f.sec !== sec) {
      sec = f.sec;
      out += `<div class="asec">${sec}${sec === "When" ?
        ' <em>points in time, 0 = start, 1 = end of the cycle</em>' : ''}</div>`;
    }
    out += `<div class="f"><label for="an-${f.k}">${f.label}` +
           (f.unit ? ` <em>${f.unit}</em>` : "") + `</label>` +
           `<input type="number" id="an-${f.k}" step="${f.step}" min="${f.min}" max="${f.max}">` +
           `<input class="sl" type="range" id="an-${f.k}-sl" min="${f.min}" max="${f.max}" step="${f.step}">` +
           `<div class="ahint">${f.hint}` +
           (f.time ? ` <b id="an-${f.k}-ms"></b>` : "") + `</div></div>`;
  }
  host.innerHTML = out;
  for (const f of ANIM_FIELDS) {
    const n = $(`an-${f.k}`), sl = $(`an-${f.k}-sl`);
    const set = val => {
      if (!isFinite(val)) return;
      ANIM[f.k] = val;
      // The three timing markers must stay in order. Previously the code
      // silently clamped them (set "pieces fully apart" to 0.3 while
      // "spin starts" was 0.1 and the animation quietly used 0.08), so
      // the slider showed one number and the motion used another. Now
      // dragging one PUSHES the others, and the readout is the truth.
      syncAnim();
      fitAnimView();
      drawGraph(parseFloat($("scrub").value));
      applyAnim(parseFloat($("scrub").value));
      save();
    };
    sl.addEventListener("input", e => set(parseFloat(e.target.value)));
    n.addEventListener("change", e => set(parseFloat(e.target.value)));
  }
  $("scrub").addEventListener("input", e => {
    // dragging the scrubber takes over: stop playback and reset the toggle
    if (animLoop) {
      animLoop = false;
      const b = $("playtoggle");
      b.classList.remove("on"); b.innerHTML = "&#9654;"; b.title = "Play";
    }
    cancelAnimationFrame(animRAF);
    applyAnim(parseFloat(e.target.value));
  });
  // One control: play loops until clicked again.
  $("playtoggle").addEventListener("click", e => {
    animLoop = !animLoop;
    e.target.classList.toggle("on", animLoop);
    e.target.innerHTML = animLoop ? "&#9632;" : "&#9654;";   // square / triangle
    e.target.title = animLoop ? "Stop" : "Play";
    if (animLoop) playAnim();
    else cancelAnimationFrame(animRAF);
  });
  $("copycss").addEventListener("click", async e => {
    const css = animCSS();
    try { await navigator.clipboard.writeText(css); }
    catch (err) { $("dout").value = css; $("dout").select(); document.execCommand("copy"); }
    const b = e.target, old = b.textContent;
    b.textContent = "Copied"; setTimeout(() => b.textContent = old, 900);
  });
}

function syncAnim() {
  for (const f of ANIM_FIELDS) {
    const n = $(`an-${f.k}`), sl = $(`an-${f.k}-sl`);
    if (document.activeElement !== n) n.value = ANIM[f.k];
    sl.value = ANIM[f.k];
    const ms = $(`an-${f.k}-ms`);
    if (ms) ms.textContent = `${Math.round(ANIM[f.k] * ANIM.dur)} ms into the cycle`;
  }
}

/**
 * Bake the timeline into CSS keyframes. Sampled rather than expressed
 * analytically, because the eased beats do not map onto CSS timing
 * functions -- 60 stops is smooth and still small.
 */
/**
 * Emit real CSS keyframes with PER-SEGMENT cubic-bezier easing.
 *
 * A single cubic-bezier() cannot express this timeline: it is a
 * monotonic progress mapping, and our rotation reverses direction twice
 * (0 -> -22 -> +374 -> 360). But CSS allows a timing function PER
 * KEYFRAME, and each of our segments IS monotonic -- so one bezier per
 * segment covers it exactly.
 *
 * The bezier is solved from the segment's endpoint velocities rather
 * than picked by eye. For a segment spanning dt in time and dv in value,
 * a normalised endpoint slope is
 *
 *     s = m * dt / dv          (m is value-units per unit-t)
 *
 * and the classic control-point placement that realises slope s at an
 * end is (1/3, s/3) from that end. Clamped to x in [0,1] as the spec
 * requires.
 *
 * This beats sampling 60 stops: the browser interpolates on the
 * compositor between 5 keyframes, which is smoother and far smaller.
 */
/**
 * Export the same three keys as CSS, using the handles directly as
 * cubic-bezier() timing functions. No sampling: the browser evaluates
 * the identical curve the preview does.
 */
function animCSS() {
  const A = ANIM;
  const span = 1 / (1 + Math.max(0, A.rest || 0));
  const end = Math.round(A.turns) * 360;
  const f3 = x => (+x).toFixed(3);

  // A segment's timing function, from the out-handle of the key it
  // leaves and the in-handle of the key it reaches.
  const ease = (outX, outY, inX, inY) =>
    `cubic-bezier(${f3(clamp01(outX))}, ${f3(outY)}, ` +
    `${f3(clamp01(1 - inX))}, ${f3(1 + inY)})`;

  const rotStops = [
    [0,          0,                ease(A.rStartHX, A.rStartHY, A.rPeakIn, 0)],
    [A.rPeakT,   A.rPeakV,         ease(A.rPeakOut, 0, A.rOverIn, 0)],
    [A.rOverT,   end + A.rOverV,   ease(A.rOverOut, 0, A.rEndHX, 0)],
    [1,          end,              null],
  ];
  const off = v => f3(A.spread * v / Math.SQRT2);
  const sepStops = [
    [0,          0,          ease(A.sStartHX, A.sStartHY, A.sPeakIn, 0)],
    [A.sPeakT,   A.sPeakV,   ease(A.sPeakOut, 0, A.sEndHX, 0)],
    [1,          0,          null],
  ];

  const emit = (stops, fmt) => {
    const rows = stops.map(([t, v, e]) =>
      `  ${(t * span * 100).toFixed(2)}% { ${fmt(v)}` +
      (e ? `\n    animation-timing-function: ${e};` : "") + ` }`);
    if (span < 0.999) {
      const last = stops[stops.length - 1];
      rows.push(`  100% { ${fmt(last[1])} }`);   // hold through the rest
    }
    return rows.join("\n");
  };

  return `/* LocTT spinner \u2014 3 keys per curve, handles as cubic-bezier.
   Markup:
     <svg viewBox="0 0 1 1"><g class="loctt-spin">
       <path class="loctt-L" d="..."/><path class="loctt-sq" d="..."/>
     </g></svg> */
.loctt-spin { transform-box: view-box; transform-origin: 0.5px 0.5px;
              animation: loctt-rot ${A.dur}ms infinite; }
.loctt-L    { animation: loctt-l  ${A.dur}ms infinite; }
.loctt-sq   { animation: loctt-sq ${A.dur}ms infinite; }

@keyframes loctt-rot {
${emit(rotStops, v => `transform: rotate(${f3(v)}deg);`)}
}
@keyframes loctt-l {
${emit(sepStops, v => `transform: translate(-${off(v)}px, ${off(v)}px);`)}
}
@keyframes loctt-sq {
${emit(sepStops, v => `transform: translate(${off(v)}px, -${off(v)}px);`)}
}`;
}

/* ---------- persistence ---------- */

// Bumped when the animation model changed shape. A stale v1 config
// merged over the new defaults could reintroduce a fractional `turns`,
// which leaves the mark facing 90 degrees off where it started.
const STORE_KEY = "loctt-logo-lab/v2";

/** Only the field values and the one checkbox; nothing derived. */
function serialise() {
  const o = { crookConcentric: S.crookConcentric, anim: { ...ANIM } };
  for (const f of FIELDS) o[f.k] = { reg: S[f.k].reg, sml: S[f.k].sml };
  return o;
}

function save() {
  // Wrapped: storage throws in private mode / blocked-cookie contexts,
  // and a failed save must never break the editor.
  try { localStorage.setItem(STORE_KEY, JSON.stringify(serialise())); }
  catch (e) { /* ignore */ }
}

function load() {
  let raw;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  let o;
  try { o = JSON.parse(raw); } catch (e) { return false; }
  if (!o || typeof o !== "object") return false;
  // Merge field by field so a stored file from an older FIELDS list (or a
  // hand-edited one) cannot introduce junk or drop a newer field.
  for (const f of FIELDS) {
    const v = o[f.k];
    if (!v || typeof v !== "object") continue;
    const reg = Number(v.reg), sml = Number(v.sml);
    if (isFinite(reg)) S[f.k].reg = reg;
    if (isFinite(sml)) S[f.k].sml = sml;
  }
  if (typeof o.crookConcentric === "boolean") S.crookConcentric = o.crookConcentric;
  if (o.anim && typeof o.anim === "object") {
    for (const f of ANIM_FIELDS) {
      const v = Number(o.anim[f.k]);
      if (isFinite(v)) ANIM[f.k] = v;
    }
  }
  return true;
}

/* ---------- export the current values as source ---------- */

function exportSource() {
  const dp = k => {
    const f = FIELDS.find(x => x.k === k);
    const st = String(f.step);
    return st.includes(".") ? st.split(".")[1].length : 0;
  };
  const rows = FIELDS.map(f => {
    const v = S[f.k], d = dp(f.k), pad = n => String(+n.toFixed(d));
    return `  { k:${(JSON.stringify(f.k) + ",").padEnd(12)}` +
           ` g:${(JSON.stringify(f.g) + ",").padEnd(14)}` +
           ` label:${(JSON.stringify(f.label) + ",").padEnd(18)}` +
           ` min:${f.min}, max:${f.max}, step:${f.step},` +
           ` reg:${pad(v.reg)}, sml:${pad(v.sml)} },`;
  }).join("\n");

  // The animation block too -- it is half the config, and leaving it out
  // meant a "copy config" that silently dropped everything you tuned in
  // the spinner section.
  const animRows = Object.keys(ANIM_DEFAULTS)
    .map(k => `  ${(k + ":").padEnd(11)} ${ANIM[k]},`)
    .join("\n");

  return `const FIELDS = [\n${rows}\n];\n\n` +
         `const S = { crookConcentric: ${S.crookConcentric} };\n\n` +
         `const ANIM = {\n${animRows}\n};`;
}

/**
 * Fire a list of [filename, text] as individual downloads. Staggered
 * because browsers silently drop simultaneous ones; the first will
 * usually prompt to allow multiple files.
 */
function downloadFiles(files) {
  files.forEach(([name, text], i) => setTimeout(() => {
    const url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, i * 120));
}

const markFiles = () => SIZES.flatMap(px =>
  VARIANTS.map(v => [`loctt-mark-${px}-${v.k}.svg`, svgMark(px, v.k)]));
const wordFiles = () => SIZES.flatMap(px =>
  VARIANTS.map(v => [`loctt-wordmark-${px}-${v.k}.svg`, svgWordmark(px, v.k)]));
const animFiles = () => VARIANTS.map(v =>
  [`loctt-animated-64-${v.k}.svg`, svgAnimated(64, v.k)]);

const flash = (b, msg = "Downloading\u2026") => {
  const old = b.textContent;
  b.textContent = msg; setTimeout(() => { b.textContent = old; }, 1400);
};

$("dl-mark").addEventListener("click", e => { downloadFiles(markFiles()); flash(e.target); });
$("dl-word").addEventListener("click", e => { downloadFiles(wordFiles()); flash(e.target); });
$("dl-anim").addEventListener("click", e => { downloadFiles(animFiles()); flash(e.target); });
$("download").addEventListener("click", e => {
  downloadFiles([...markFiles(), ...wordFiles(), ...animFiles()]);
  flash(e.target);
});

$("copyanim").addEventListener("click", async e => {
  const text = "const ANIM = {\n" +
    Object.keys(ANIM_DEFAULTS).map(k => `  ${(k + ":").padEnd(11)} ${ANIM[k]},`).join("\n") +
    "\n};";
  try { await navigator.clipboard.writeText(text); }
  catch (err) { $("dout").value = text; $("dout").select(); document.execCommand("copy"); }
  const b = e.target, old = b.textContent;
  b.textContent = "Copied"; setTimeout(() => { b.textContent = old; }, 1200);
});

$("export").addEventListener("click", async () => {
  const text = exportSource();
  $("dout").value = text;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { $("dout").select(); document.execCommand("copy"); }
  const b = $("export"), old = b.textContent;
  b.textContent = "Copied to clipboard";
  setTimeout(() => { b.textContent = old; render(); }, 1400);
});

buildAnimControls();
buildControls();
load();
syncAll();
syncAnim();
render();
fitAnimView();
drawGraph(0);
applyAnim(0);
</script>
</body>
</html>
