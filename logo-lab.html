<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocTT Logo Lab</title>
<style>
  :root {
    --bg: #14151a;
    --panel: #1c1e25;
    --panel-2: #23262f;
    --line: #32363f;
    --text: #e8eaef;
    --dim: #9aa0ad;
    --accent: #6ea8fe;
    --mark: #e8eaef;
    --canvas: #101116;
    --grid: #262a33;
    --logo-accent: #39A88F;   /* dark-mode accent, matching PALETTE */
    --logo-ink: #F4F4F3;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f7f8fa;
    --line: #dcdfe5;
    --text: #1a1c22;
    --dim: #676e7d;
    --accent: #2563eb;
    --mark: #1a1c22;
    --canvas: #ffffff;
    --grid: #e6e8ee;
    --logo-accent: #0F766E;   /* light-mode accent */
    --logo-ink: #0F172A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Segoe UI, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .sp { flex: 1; }
  /* Two-column grid: every control pane sits in column 1 beside the
     preview it drives in column 2. Rows are grid siblings, so each
     section aligns with its own output without any JS. The page scrolls
     as a whole -- panes are no longer independently scrolling columns,
     which is what previously hid the lower sections below the fold. */
  .wrap {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    align-items: start;
    gap: 0 0;
  }
  .pane {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 16px 18px 20px;
  }
  .view {
    border-bottom: 1px solid var(--line);
    padding: 20px 22px 24px;
    min-width: 0;
  }
  .outrow { grid-column: 1 / -1; padding: 20px 22px 40px; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; }
    .pane { border-right: none; }
  }

  .group { margin-bottom: 22px; }
  .group > h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  .ctl { margin-bottom: 13px; }
  .ctl .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .ctl label { font-weight: 500; }
  .ctl .val {
    margin-left: auto; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px;
  }
  .ctl input[type=range] {
    width: 100%; margin: 0; accent-color: var(--accent);
  }
  .ctl.disabled { opacity: .38; pointer-events: none; }

  /* two-value rows: regular | small */
  .sizehdr {
    display: grid; grid-template-columns: 1fr 74px 74px; gap: 6px;
    align-items: end; margin: 2px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .sizehdr .col {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); text-align: center; line-height: 1.25;
  }
  .sizehdr em { display: block; font-style: normal; font-size: 9px; opacity: .7; letter-spacing: 0; }
  .f { display: grid; grid-template-columns: 1fr 74px 74px; gap: 6px;
       align-items: center; margin-bottom: 7px; }
  .f > label { font-weight: 500; font-size: 12px; }
  .f input[type=number] {
    width: 100%; font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px;
    text-align: right; -moz-appearance: textfield;
  }
  .f input[type=number]::-webkit-outer-spin-button,
  .f input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .f input:focus { outline: none; border-color: var(--accent); }
  .f .slreg { grid-column: 1 / 3; margin: 0 0 2px; }
  .f .slsml { grid-column: 3 / -1; margin: 0 0 2px; }
  .f .slsml { accent-color: var(--dim); }
  .f input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .chk { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; cursor: pointer; }
  .chk input { accent-color: var(--accent); margin: 0; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }

  /* ---- stage ---- */
  .board {
    background: var(--canvas); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px;
    display: flex; justify-content: center;
  }
  .board svg { width: min(460px, 100%); height: auto; display: block; }

  /* Thumbnails wrap rather than overflow. The wordmark row is ~4.4x
     wider than the square-mark row, so a fixed flex line clipped it;
     min-width:0 + wrap lets each figure keep its natural size and spill
     onto the next line instead of being cut off. */
  .sizes {
    display: flex; align-items: flex-end; flex-wrap: wrap;
    gap: 18px 22px; margin-top: 22px; max-width: 100%;
  }
  .sizes figure { margin: 0; text-align: center; min-width: 0; max-width: 100%; }
  .sizes figcaption { color: var(--dim); font-size: 10px; margin-top: 6px; }
  .sizes svg { display: block; max-width: 100%; height: auto; }
  /* the wordmark row runs widest -- give it its own line per item when
     the pane is narrow */
  #wordsizes figure { flex: 0 0 auto; }

  /* animation rows: label | number | slider (single value, no reg/small) */
  .a .f { grid-template-columns: 1fr 74px; margin-bottom: 12px; }
  .a .f .sl { grid-column: 1 / -1; }
  .a .f > label em { font-style: normal; color: var(--dim); font-weight: 400; font-size: 11px; }
  .ahint { grid-column: 1 / -1; color: var(--dim); font-size: 11px; margin-top: 3px; }
  .ahint b { display: block; margin-top: 2px; color: var(--accent); font-weight: 500; }
  .asec {
    grid-column: 1 / -1; font-size: 10px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--dim); font-weight: 600;
    margin: 14px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .asec:first-child { margin-top: 2px; }
  .asec em { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .75; }
  .chart { margin-top: 14px; }
  .chart svg {
    /* aspect-ratio instead of a fixed height: the viewBox keeps its
       proportions, so the plot fills the full width without
       letterboxing and without stretching the labels. */
    width: 100%; height: auto; aspect-ratio: 400 / 150; display: block;
    background: var(--canvas); border: 1px solid var(--line); border-radius: 8px;
  }
  .legend {
    display: flex; gap: 16px; margin-top: 7px;
    font-size: 11px; color: var(--dim);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
  .legend .k-rot { background: var(--accent); }
  .legend .k-sep { background: #e5a13a; }
  .legend .k-now { background: var(--text); }

  .scrub { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); }
  #playtoggle {
    flex: 0 0 auto; width: 34px; height: 30px; padding: 0;
    font-size: 12px; line-height: 1; display: grid; place-items: center;
  }
  #playtoggle.on { border-color: var(--accent); color: var(--accent); }
  /* One ROW per colour variant, each row showing every size on the
     background that variant is designed for. */
  .rows { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .vrow { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .vrow .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); padding: 7px 10px 0;
  }
  .vrow .strip {
    display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
    padding: 10px 12px 12px;
  }
  .vrow .strip figure { margin: 0; text-align: center; }
  .vrow .strip svg { display: block; }
  .vrow .strip figcaption { font-size: 9px; margin-top: 5px; opacity: .55; }
  /* animation previews: a plain swatch per variant, no row chrome */
  #animrows2 { flex-direction: row; flex-wrap: wrap; gap: 12px; }
  /* The backing is the minimum needed to SEE each variant -- a dark
     logo is invisible on a dark page -- so it hugs the mark rather than
     reading as a card. The light variants get a pale backing, the dark
     ones none at all, since the page is already dark. */
  .apvf { margin: 0; text-align: center; padding: 0; }
  .apvf svg { display: block; height: 56px; width: auto; border-radius: 4px; }
  .apvf.on-light svg { background: #F4F4F3; }
  .apvf figcaption { font-size: 9px; margin-top: 5px; color: var(--dim); }

  .vrow.on-light { background: #F4F4F3; }
  .vrow.on-dark  { background: #0F172A; }
  .vrow.on-light .lbl, .vrow.on-light figcaption { color: #0F172A; }
  .vrow.on-dark  .lbl, .vrow.on-dark  figcaption { color: #F4F4F3; }



  .metrics {
    margin-top: 22px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
  }
  .metrics div {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px;
  }
  .metrics b { display: block; font-weight: 500; color: var(--dim); font-size: 10px;
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
  .metrics span { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .warn { color: #e5a13a; }

  .out { margin-top: 22px; }
  .out h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .out h2 button { margin-left: auto; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }
</style>
</head>
<body>

<header>
  <h1>Logo Lab — notched square + counter</h1>
  <div class="sp"></div>
  <div class="btnrow">
    <button id="theme">Light</button>
    <button id="export">Copy config</button>
    <button id="reset">Reset</button>
  </div>
</header>

<div class="wrap">

  <!-- Each ROW pairs a control group with the preview it drives, so the
       sidebar section and its output sit side by side. The grid is a
       single two-column track list; rows are siblings, which is what
       keeps them aligned without any JS. -->

  <!-- ---- row: the mark ---- -->
  <div class="pane">
    <div class="sizehdr">
      <span></span><span class="col">regular<em>&ge;64px</em></span><span class="col">small<em>16px</em></span>
    </div>
    <div class="group" id="g-geometry"><h2>Geometry</h2></div>
    <div class="group" id="g-curvature"><h2>Curvature</h2>
      <label class="chk"><input type="checkbox" id="crookConcentric" checked> inner corner = radius + gap</label>
    </div>
    <div class="hint" id="derivedR"></div>
    <div class="hint warn" id="cap-rSquare"></div>
  </div>
  <div class="view">
    <div class="board">
      <svg id="big" viewBox="-0.06 -0.06 1.12 1.12" xmlns="http://www.w3.org/2000/svg">
        <g id="mark"></g>
      </svg>
    </div>
    <div class="rows" id="markrows"></div>

    <div class="btnrow" style="margin-top:14px">
      <button id="dl-mark">Download mark</button>
      <span class="hint" style="margin:0 0 0 4px">all sizes &times; 4 variants</span>
    </div>
  </div>

  <!-- ---- row: the letters ---- -->
  <div class="pane">
    <div class="group" id="g-letters"><h2>Letters &mdash; CTT</h2></div>
  </div>
  <div class="view">
    <div class="board">
      <svg id="word" viewBox="0 0 4 1" xmlns="http://www.w3.org/2000/svg" style="width:100%">
        <g id="wordmark"></g>
      </svg>
    </div>
    <div class="rows" id="wordrows"></div>

    <div class="btnrow" style="margin-top:14px">
      <button id="dl-word">Download wordmark</button>
      <span class="hint" style="margin:0 0 0 4px">all sizes &times; 4 variants</span>
    </div>

  </div>

  <!-- ---- row: the spinner ---- -->
  <div class="pane">
    <div class="group" id="g-anim">
      <h2>Animation &mdash; spinner</h2>
      <div class="a" id="animrows"></div>
      <div class="btnrow" style="margin-top:8px">
        <button id="copycss">Copy CSS</button>
      </div>
    </div>
  </div>
  <div class="view">
    <div class="board" style="position:relative">
      <svg id="anim" viewBox="-0.45 -0.45 1.9 1.9" xmlns="http://www.w3.org/2000/svg" style="width:min(300px,100%)">
        <g id="spin">
          <path id="aL"  fill="var(--mark)"></path>
          <path id="aSq" fill="var(--mark)"></path>
        </g>
      </svg>
    </div>
    <div class="scrub">
      <button id="playtoggle" title="Play / stop">&#9654;</button>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0">
    </div>

    <div class="chart">
      <svg id="graph" viewBox="0 0 400 150"></svg>
      <div class="legend">
        <span><i class="k-rot"></i>rotation</span>
        <span><i class="k-sep"></i>separation</span>
        <span><i class="k-now"></i>playhead</span>
      </div>
      <div class="hint" id="animOut"></div>
      <div class="rows" id="animrows2"></div>

      <div class="btnrow" style="margin-top:8px">
        <button id="copyanim">Copy animation config</button>
        <button id="dl-anim">Download animated</button>
      </div>
    </div>
  </div>

  <!-- ---- row: output, full width ---- -->
  <div class="outrow">
    <div class="out">
      <h2>path d <button id="copyd">Copy</button></h2>
      <textarea id="dout" readonly spellcheck="false"></textarea>
    </div>
    <div class="out">
      <h2>all svgs &mdash; LO + LOCTT, every size <button id="download">Download everything</button><button id="copysvg">Copy</button></h2>
      <textarea id="svgout" readonly spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------
   GEOMETRY

   Unit square, y down, origin top-left.

   `corner` c: the diagonal cut runs from (1-c, 0) on the top edge to
   (1, c) on the right edge. It removes the top-right triangle. c=1 is
   the full diagonal (half the square gone); the slider caps there.

   The cut line has outward normal n = (1,-1)/sqrt2. Signed distance
   from a point p to the cut line is dot(p - (1,0), n).

   The counter square sits in the removed triangle, pushed `inset` off
   the top and right edges, and `gap` off the cut measured along n.
   Its top-right corner is at (1-inset, inset). With side s its
   bottom-left corner is (1-inset-s, inset+s), whose distance to the
   cut is (s + ... ) -- working it through, requiring that bottom-left
   corner to sit `gap` clear of the cut gives

        s = c - gap*sqrt2 - 2*inset

   i.e. `gap` in perpendicular units costs sqrt2 of nominal width.
   We surface BOTH numbers in the metrics so the trade is visible.
------------------------------------------------------------------ */

const R2 = Math.SQRT2;

/* --------------------------------------------------------------------
   TWO VALUES PER FIELD, INTERPOLATED BY SIZE

   A shape tuned at 64px+ does not hold at 16px: hairline gaps close up,
   optical corrections that look right large look heavy small. So every
   field carries TWO numbers -- `reg` (what it should be at 64px and
   above) and `sml` (at 16px) -- and the value actually used is a linear
   interpolation between them:

       t = clamp((px - 16) / (64 - 16), 0, 1)
       value = sml + (reg - sml) * t

   At >=64px you get `reg` exactly; at <=16px you get `sml` exactly.
   Leave the two equal and the field simply does not vary with size.
-------------------------------------------------------------------- */
const SMALL_PX = 16, REG_PX = 64;

const FIELDS = [
  { k:"corner",    g:"geometry",    label:"corner",          min:0, max:0.95, step:0.001, reg:0.62, sml:0.62 },
  { k:"bevel",     g:"geometry",    label:"bevel",           min:0, max:1, step:0.001, reg:0.35, sml:0.35 },
  { k:"gap",       g:"geometry",    label:"gap",             min:0, max:0.5, step:0.001, reg:0.1, sml:0.13 },
  { k:"inset",     g:"geometry",    label:"inset",           min:0, max:0.5, step:0.001, reg:0.07, sml:0.07 },
  { k:"rSquare",   g:"curvature",   label:"corner radius",   min:0, max:0.5, step:0.001, reg:0.087, sml:0.07 },
  { k:"optical",   g:"curvature",   label:"optical",         min:0, max:1, step:0.01, reg:0.19, sml:0.5 },
  { k:"rDiag",     g:"curvature",   label:"diagonal bias",   min:0.2, max:3, step:0.01, reg:1, sml:1 },
  { k:"cCutW",     g:"letters",     label:"C cut width",     min:0, max:0.9, step:0.005, reg:0.5, sml:0.5 },
  { k:"cCutH",     g:"letters",     label:"C cut height",    min:0, max:0.9, step:0.005, reg:0.45, sml:0.45 },
  { k:"tCutW",     g:"letters",     label:"T cut width",     min:0, max:0.49, step:0.005, reg:0.3, sml:0.3 },
  { k:"tCutH",     g:"letters",     label:"T cut height",    min:0, max:0.9, step:0.005, reg:0.65, sml:0.65 },
  { k:"wordGap",   g:"letters",     label:"letter gap",      min:0, max:0.6, step:0.005, reg:0.12, sml:0.12 },
  { k:"wordScale", g:"letters",     label:"CTT scale",       min:0.3, max:1.2, step:0.005, reg:1, sml:1 },
];

// S holds {reg, sml} per field, plus the non-interpolated settings.
const S = { crookConcentric: true };
for (const f of FIELDS) S[f.k] = { reg: f.reg, sml: f.sml };

const SIZES = [16, 24, 32, 48, 64];   // thumbnails shown under the mark

/* --------------------------------------------------------------------
   COLOUR VARIANTS

   The mark has two parts and they take different tokens:
     the L      -> --accent        (teal)
     the square -> --text-primary  (near-black / off-white)

   `currentColor` keeps a variant that inherits from its container, which
   is what the app itself uses. The token variant emits var(--accent) /
   var(--text-primary) so it tracks a theme with no separate dark asset.
-------------------------------------------------------------------- */
const PALETTE = {
  accent:      { light: "#0F766E", dark: "#39A88F" },
  textPrimary: { light: "#0F172A", dark: "#F4F4F3" },
};

/* Four modes on two axes: THEME (light / dark) x COLOUR (coloured or
   monochrome). Coloured gives the teal L against ink; monochrome puts
   the whole mark in one ink colour, which is the standard one-colour
   lockup and matches what `currentColor` yields. */
const VARIANTS = [
  { k: "light",       label: "light",            theme: "light", colour: false,
    l: PALETTE.textPrimary.light, o: PALETTE.textPrimary.light },
  { k: "dark",        label: "dark",             theme: "dark",  colour: false,
    l: PALETTE.textPrimary.dark,  o: PALETTE.textPrimary.dark },
  { k: "light-color", label: "light coloured",   theme: "light", colour: true,
    l: PALETTE.accent.light,      o: PALETTE.textPrimary.light },
  { k: "dark-color",  label: "dark coloured",    theme: "dark",  colour: true,
    l: PALETTE.accent.dark,       o: PALETTE.textPrimary.dark },
];


const EXPORT_SIZE = 100;              // viewBox of the copyable output
const EXPORT_PREC = 3;

/** The parameter set at a given pixel size. */
function paramsAt(px) {
  const t = Math.max(0, Math.min(1, (px - SMALL_PX) / (REG_PX - SMALL_PX)));
  const out = { crookConcentric: S.crookConcentric };
  for (const f of FIELDS) {
    const v = S[f.k];
    out[f.k] = v.sml + (v.reg - v.sml) * t;
  }
  return out;
}


/* ---------- path helpers ---------- */

const v  = (a,b) => [a[0]-b[0], a[1]-b[1]];
const len = a => Math.hypot(a[0], a[1]);
const norm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l]; };
const add = (a,b,k=1) => [a[0]+b[0]*k, a[1]+b[1]*k];
const cross = (a,b) => a[0]*b[1] - a[1]*b[0];

/**
 * Round the polygon `pts` (closed, any winding) where radii[i] is the
 * requested radius at vertex i. Each radius is clamped so adjacent
 * fillets can never overrun a shared edge — the classic failure that
 * makes rounded paths fold inside out at high radius.
 */
function roundPoly(pts, radii) {
  // Drop vertices that coincide with their predecessor. A zero-length
  // edge gives an undefined edge direction, which propagates NaN through
  // the fillet maths and reads as a self-intersection. Parameter caps
  // aim to prevent these; this makes it structurally impossible.
  {
    const p = [], r = [];
    for (let i = 0; i < pts.length; i++) {
      const prev = p.length ? p[p.length-1] : pts[pts.length-1];
      if (len(v(pts[i], prev)) > 1e-9) { p.push(pts[i]); r.push(radii[i]); }
    }
    // collapsing the wrap-around too
    while (p.length > 3 && len(v(p[0], p[p.length-1])) <= 1e-9) { p.pop(); r.pop(); }
    if (p.length < 3) return "";
    pts = p; radii = r;
  }
  const n = pts.length;

  // tangent length wanted at each vertex, from its interior angle
  const want = new Array(n);
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
    const u = norm(v(a,p)), w = norm(v(b,p));
    let cosT = Math.max(-1, Math.min(1, u[0]*w[0] + u[1]*w[1]));
    const theta = Math.acos(cosT);          // angle between the two edges
    const r = radii[i] || 0;
    // tangent distance from the vertex for a circle of radius r
    want[i] = (r <= 0 || theta < 1e-6 || Math.abs(Math.PI - theta) < 1e-6)
      ? 0 : r / Math.tan(theta / 2);
  }

  // Clamp per edge: t[i] + t[i+1] <= edge length.
  //
  // Scaling BOTH ends by the same factor (the obvious fix) preserves the
  // ratio between two competing radii, so a vertex that asked for a lot
  // keeps more than one that asked for little -- the shape goes lopsided
  // instead of degrading evenly. Instead give each edge's budget out
  // fairly: equal shares, and anyone wanting less than its share keeps
  // what it asked for, releasing the remainder to the other end.
  const t = want.slice();
  for (let pass = 0; pass < 4; pass++) {
    let changed = false;
    for (let i = 0; i < n; i++) {
      const j = (i+1)%n;
      const L = len(v(pts[j], pts[i]));
      if (t[i] + t[j] <= L + 1e-12) continue;
      const half = L / 2;
      let ti, tj;
      if (t[i] <= half)      { ti = t[i];        tj = L - ti; }  // i is modest
      else if (t[j] <= half) { tj = t[j];        ti = L - tj; }  // j is modest
      else                   { ti = half;        tj = half;   }  // both greedy
      if (Math.abs(ti-t[i]) > 1e-12 || Math.abs(tj-t[j]) > 1e-12) changed = true;
      t[i] = ti; t[j] = tj;
    }
    if (!changed) break;
  }

  let d = "", first = null;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
    const u = norm(v(a,p)), w = norm(v(b,p));
    const ti = t[i];
    if (ti <= 1e-9) {
      if (!first) { first = p; d += `M${P(p)}`; } else d += `L${P(p)}`;
      continue;
    }
    let cosT = Math.max(-1, Math.min(1, u[0]*w[0] + u[1]*w[1]));
    const theta = Math.acos(cosT);
    const sgn = cross(v(p,a), v(b,p)) > 0 ? 1 : -1;
    const r = ti * Math.tan(theta/2);
    const inPt  = add(p, u, ti);   // where the fillet starts
    const outPt = add(p, w, ti);   // where it ends
    if (!first) { first = inPt; d += `M${P(inPt)}`; } else d += `L${P(inPt)}`;
    d += `A${N(r)} ${N(r)} 0 0 ${sgn > 0 ? 1 : 0} ${P(outPt)}`;
  }
  return d + "Z";
}

let PREC = 2;
const N = x => {
  const s = (Math.abs(x) < 1e-9 ? 0 : x).toFixed(PREC);
  return s.replace(/\.?0+$/, "") || "0";
};
const P = p => `${N(p[0])} ${N(p[1])}`;

/* ---------- the mark ---------- */

/* --------------------------------------------------------------------
   CORNER RADIUS: LITERAL, THE WAY ILLUSTRATOR AND FIGMA DO IT

   A corner radius is a physical thing: the circle of radius r inscribed
   tangent to both edges. Its tangent points sit r/tan(T/2) back from the
   vertex, so an ACUTE corner eats far more edge than an OBTUSE one at the
   same r. That asymmetry is correct and expected -- it is what "8px
   radius" means, and it is what makes the corner match a rounded
   rectangle sitting beside it.

   This file previously "compensated" for angle by equalising the sagitta
   (the depth the curve cuts into the corner), which inflated a 135-degree
   corner to 5.03x the square radius. That was wrong on three counts:

     1. Nothing does this. Illustrator's Live Corners gives "an actual
        real radius measured from the centre point of the curve", with
        identical centre points at 90 and 135 degrees. Figma's arc is
        likewise "based on an inscribed circle".
     2. Illustrator DID consider angle compensation and went the OPPOSITE
        way: its opt-in "Relative" rounding REDUCES the radius at sharp
        corners so they stop ballooning. Growing the obtuse radius is the
        inverse of the one correction the tool actually offers.
     3. Measured here, it did not even achieve its own goal -- the cap
        starved it to sagitta 0.0103 against the square corners' 0.0409 --
        while consuming 51-61% of each bevel edge against 20% of the long
        outer edges, so the straight runs came out wildly uneven.

   (Illustrator's legacy Effect > Round Corners is a separate, broken
   thing that measures from the vertex rather than the circle centre, so
   its input behaves as the TANGENT length: true R = L*tan(T/2). At 135
   degrees an input of 30pt yields a real radius of 72.4pt. We do not
   copy that; it over-rounds obtuse corners.)

   So: one literal radius per corner, no angle correction. If a 135-degree
   corner reads too crisp, nudge ITS slider -- that is a deliberate
   optical tweak, which is how designers handle it, and exactly why the
   diagonal corners have their own control.
-------------------------------------------------------------------- */

/** Interior angle at vertex i of a closed polygon, in radians. */
function interiorAngle(pts, i) {
  const n = pts.length;
  const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
  const u = norm(v(a,p)), w = norm(v(b,p));
  const c = Math.max(-1, Math.min(1, u[0]*w[0] + u[1]*w[1]));
  return Math.acos(c);
}

function geometry(s) {
  const c = Math.max(0, Math.min(1, s.corner));
  const inset = s.inset;

  // Counter square, nested in the bite. The two params are independent,
  // each measured against a DIFFERENT pair of edges -- which is the whole
  // point: inset never eats into the gap.
  //
  //   inset -> distance from the top and right edges of the unit square
  //   gap   -> distance from the L's two inner edges (x=armX and y=armY)
  //
  // The bite is c wide and c tall. Take `inset` off the outer pair and
  // `gap` off the inner pair, and whatever is left is the counter:
  //
  //   side = c - inset - gap
  //
  // Both are straight axis-aligned subtractions -- no sqrt2, no /2,
  // because neither corner is being pinned against the diagonal.
  const side = c - inset - s.gap;

  // A single straight cut across a square yields a CHAMFERED SQUARE, never
  // an L -- at any value of c. The L needs the corner removed as a
  // RECTANGULAR bite whose inner corner then gets the diagonal treatment.
  //
  // So: `corner` c is how much of the corner is bitten out (c of the width
  // and c of the height, per the original spec: 0.5 => a quarter of the
  // area gone). That alone gives a clean L with arms (1-c) wide:
  //
  //     (0,0) - (1-c,0) - (1-c,c) - (1,c) - (1,1) - (0,1)
  //                          ^ the L's inner (concave) corner
  //
  // `bevel` then slices the L's two LEG TIPS along the TL->BR diagonal --
  // not the inner crook. The L has two free ends:
  //
  //   the vertical leg's tip, where it meets the TOP edge    (0,0)-(armX,0)
  //   the horizontal leg's tip, where it meets the RIGHT edge (1,armY)-(1,1)
  //
  // A slope-1 cut across each tip truncates it at 45 degrees, so both legs
  // end on the same diagonal direction. bevel is the fraction of the leg's
  // own width taken off; bevel=1 cuts the tip to a point.
  const armX = 1 - c;          // vertical leg: x from 0..armX
  const armY = c;              // where the horizontal leg's top edge sits
  const wV = armX;             // vertical leg width
  const wH = 1 - armY;         // horizontal leg width (bottom band height)

  // Cap the bevel so the outline cannot fold through itself.
  //
  // The vertical-leg cut runs from (armX - bV, 0) to (armX, bV) where
  // bV = bevel*wV. Its lower vertex must stay ABOVE the crook at y = armY,
  // so bV <= armY  =>  bevel <= armY / wV. Symmetrically for the
  // horizontal leg: bH = bevel*wH must not pass the crook at x = armX.
  //
  // The right-arm cut runs from (1 - bH, armY) to (1, armY + bH) where
  // bH = bevel*wH. It must not run back past the crook along the bite's
  // edge (which is c long), so bH <= c; and it must not run below the
  // bottom edge, so armY + bH <= 1, i.e. bH <= wH.
  //
  // Wide legs with a shallow bite (small `corner`) bind first -- c=0.2
  // gives wV=0.8 against armY=0.2, so the ceiling is 0.25. A flat cap
  // alone is nowhere near enough; it let c=0.2 self-intersect at every
  // bevel above 0. (Verified over a 50-combo sweep.)
  //
  // The 0.98 factor keeps each bevel vertex strictly short of its
  // limit: landing exactly ON one makes a duplicate vertex / zero-length
  // edge, which reads as a self-intersection and breaks the fillet maths.
  const bevelMax = Math.max(0, Math.min(
    0.92,                                          // keep the tip from collapsing
    wV > 1e-6 ? 0.98 * armY / wV : 0.92,           // vertical arm: don't reach the crook
    wH > 1e-6 ? 0.98 * c / wH : 0.92,              // right arm: don't reach the crook
    0.98                                           // right arm: stay above the bottom edge
  ));
  const bevel = Math.max(0, Math.min(bevelMax, s.bevel));

  // Every radius comes from just two sliders:
  //
  //   rSquare -- the 90 degree corners: the L's three outer corners and
  //              the counter's four. The L's INNER corner (the crook)
  //              also takes it, plus the gap, so the crook's curve and
  //              the counter's facing curve stay concentric.
  //   rDiag   -- the diagonal cut's corners, applied literally
  //              as a literal radius, like every other drawing tool.
  //
  // Marker constants let radiusLimits() probe which slider owns which
  // vertex; DIAG entries are resolved to real radii just below.
  const SQ = s.rSquare;
  const DIAG = -1;               // placeholder: resolved by angle, below
  // The L's inner (concave) corner. Adding the gap makes its curve
  // CONCENTRIC with the counter's facing corner -- the two arcs then
  // share a centre and the channel between them keeps constant width.
  // That is a deliberate offset, not part of the radius model: with
  // `crookConcentric` off it simply takes the same radius as every other
  // corner, so setting one number really does give one curvature
  // everywhere.
  const CROOK = s.crookConcentric === false ? SQ : SQ + s.gap;

  let outerPts, outerR;
  if (c <= 1e-6) {
    outerPts = [[0,0],[1,0],[1,1],[0,1]];
    outerR   = [SQ, SQ, SQ, SQ];
  } else if (bevel <= 1e-6) {
    // crisp L, six vertices -- no diagonal at all
    outerPts = [[0,0], [armX,0], [armX,armY], [1,armY], [1,1], [0,1]];
    outerR   = [SQ, SQ, CROOK, SQ, SQ, SQ];
  } else {
    // Vertical leg tip: cut from (armX - bV, 0) down to (armX, bV), so the
    // top of the leg is sheared back on a slope-1 line.
    const bV = bevel * wV;
    // Right arm: bevel the TOP corner of that arm -- the one at (1, armY)
    // where the bite's edge meets the right edge, facing the counter.
    // NOT the bottom-right corner of the unit square, which stays square.
    const bH = bevel * wH;

    outerPts = [
      [0, 0],                    // TL
      [armX - bV, 0],            // start of vertical-leg bevel (top edge)
      [armX, bV],                // end of vertical-leg bevel
      [armX, armY],              // inner crook
      [1 - bH, armY],            // start of right-arm bevel (on the bite's edge)
      [1, armY + bH],            // end of right-arm bevel (on the right edge)
      [1, 1],                    // BR -- stays square
      [0, 1]                     // BL
    ];
    outerR = [
      SQ,                        // TL
      DIAG, DIAG,                // vertical-leg bevel corners
      CROOK,                     // inner crook (concave)
      DIAG, DIAG,                // right-arm bevel corners
      SQ,                        // BR
      SQ                         // BL -- the L's heel
    ];
  }

  // Resolve the DIAG placeholders. Each diagonal corner gets the radius
  // that gives it the same tangent length as a 90-degree corner of
  // radius rDiag -- so the two obtuse (135) and two acute (45) corners
  // come out visually matched instead of needing separate sliders.
  // ANGLE COMPENSATION.
  //
  // At equal radius R, a 135-degree corner consumes 2.414x LESS edge than
  // a 90-degree one (q = R/tan(th/2)) and cuts in 5.03x less deep. That
  // size disparity -- not curvature -- is what makes equal radii look
  // unequal. Smoothing cannot touch it: it scales both corners by the
  // same (1+s), leaving the ratio at 2.414 exactly. Measured, not assumed.
  //
  // `optical` blends between the two defensible endpoints:
  //
  //   0 = literal radius      R(th) = R                 (Illustrator/Figma)
  //   1 = equal footprint     R(th) = R * tan(th/2)/tan(45) = 2.414x @135
  //
  // as  R(th) = R * (tan(th/2)/tan(45)) ** optical.
  //
  // Glyphs is the only shipped tool with an angle correction ("Visual
  // Corrections": larger radii at obtuse corners, which is this
  // direction) but it does not publish the factor, so the exponent is a
  // dial for the eye rather than a derived constant.
  // ONE radius drives every corner. `radius` is the 90-degree value; a
  // corner at any other angle derives from it:
  //
  //     R(th) = radius * (tan(th/2) / tan(45)) ** optical
  //
  //   optical = 0  -> literal equal radius everywhere (Illustrator/Figma).
  //                   A 135-degree corner then consumes 2.414x LESS edge
  //                   than a 90-degree one and reads much smaller.
  //   optical = 1  -> equal edge footprint: every corner eats the same
  //                   length of its edges. 2.414x radius at 135 degrees.
  //
  // `diagBias` then multiplies the non-90 corners on top, for hand
  // tuning when the formula is close but not your eye's answer.
  //
  // (Glyphs is the only shipped tool with an angle correction -- larger
  // radii at obtuse corners, this direction -- but does not publish the
  // factor, so `optical` is a dial, not a derived constant.)
  const K = Math.max(0, Math.min(1, s.optical ?? 0));
  const BIAS = s.rDiag ?? 1;
  outerR = outerR.map((r, i) => {
    if (r !== DIAG) return r;
    const T = interiorAngle(outerPts, i);
    const scaled = SQ * Math.pow(Math.tan(T/2) / Math.tan(Math.PI/4), K);
    return scaled * BIAS;
  });

  // Counter square, top-right corner at (1-inset, inset). All four of its
  // corners are 90 degrees, so they take rSquare directly.
  const x1 = 1 - inset, y0 = inset;
  const x0 = x1 - side, y1 = y0 + side;
  const small = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  const rSmall = [SQ, SQ, SQ, SQ];

  return { c, side, outerPts, outerR, small, rSmall, inset, bevelMax };
}

/**
 * Clamp the radius sliders to what the current geometry can actually
 * render. This is where the clamp lives now -- NOT in render()'s readout
 * loop, which used to write back into the <input> and fight the pointer
 * mid-drag. Sliders hold intent; this holds what gets drawn.
 */
function effectiveRadii(s) {
  // The sliders are ABSOLUTE radii, matching what every drawing tool
  // means by a corner radius. Clamp each to what its corner can hold --
  // the ceiling is in tangent-length space (a corner's two fillets must
  // fit the edges they share), which is what maxRadiusAt() returns.
  //
  // Clamping lives here and NOT in render(): writing a clamped value back
  // into the <input> fights the pointer mid-drag and makes the thumb
  // jitter. The slider holds intent; this holds what gets drawn.
  const lim = radiusLimits(s);
  const out = { ...s };
  const cap = Math.max(0, Math.min(0.5, lim.rSquare));
  out.rSquare = Math.max(0, Math.min(cap, s.rSquare));
  return out;
}



/* --------------------------------------------------------------------
   LETTERFORMS

   C and T are built the same way as the L: a unit-square block with
   rectangular bites taken out, then run through the SAME roundPoly with
   the SAME rSquare, so every letter's corners match the mark's.

   Concave corners (the inside of a bite) take rSquare too -- roundPoly
   works out convex vs concave from the winding, so nothing special is
   needed here.
-------------------------------------------------------------------- */

/** C: block with one rectangular bite out of the middle of the right edge. */
function letterC(s) {
  const w = Math.max(0, Math.min(0.95, s.cCutW));
  const h = Math.max(0, Math.min(0.95, s.cCutH));
  const R = s.rSquare;
  if (w <= 1e-6 || h <= 1e-6) {
    return { pts: [[0,0],[1,0],[1,1],[0,1]], r: [R,R,R,R] };
  }
  const y0 = (1 - h) / 2, y1 = y0 + h;   // bite is vertically centred
  const x  = 1 - w;                      // how far in the bite reaches
  return {
    pts: [
      [0,0], [1,0], [1,y0],   // top edge, down to the bite
      [x,y0], [x,y1],         // into the bite and across  (concave)
      [1,y1], [1,1], [0,1]    // back out, down, and home
    ],
    r: [R,R,R, R,R, R,R,R]
  };
}

/** T: block with a rectangular bite out of each bottom corner. */
function letterT(s) {
  const w = Math.max(0, Math.min(0.49, s.tCutW));
  const h = Math.max(0, Math.min(0.95, s.tCutH));
  const R = s.rSquare;
  if (w <= 1e-6 || h <= 1e-6) {
    return { pts: [[0,0],[1,0],[1,1],[0,1]], r: [R,R,R,R] };
  }
  const y = 1 - h;            // underside of the crossbar
  return {
    pts: [
      [0,0], [1,0],           // the crossbar's top
      [1,y], [1-w,y],         // down the right, in along the bar
      [1-w,1], [w,1],         // down the stem's right, across its foot
      [w,y], [0,y]            // up the stem's left, out along the bar
    ],
    r: [R,R, R,R, R,R, R,R]
  };
}

function buildPath(sRaw) {
  const s = effectiveRadii(sRaw);
  const g = geometry(s);
  // Keep the two subpaths separately as well as combined: the animation
  // moves them independently, while the export stays one evenodd path.
  const dL = roundPoly(g.outerPts, g.outerR);
  const dSq = g.side > 1e-4 ? roundPoly(g.small, g.rSmall) : "";
  const d = dSq ? dL + " " + dSq : dL;
  return { d, dL, dSq, g };
}

/**
 * Largest radius vertex `i` of `pts` can take while still being drawn
 * exactly as asked. The fillet needs tangent length r/tan(theta/2) at
 * the vertex, and may use at most half of each adjoining edge (half,
 * not all, because the neighbour has an equal claim). Invert that.
 */
function maxRadiusAt(pts, i) {
  const n = pts.length;
  const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
  const u = norm(v(a,p)), w = norm(v(b,p));
  const cosT = Math.max(-1, Math.min(1, u[0]*w[0] + u[1]*w[1]));
  const theta = Math.acos(cosT);
  if (theta < 1e-6 || Math.abs(Math.PI - theta) < 1e-6) return 0;
  const budget = Math.min(len(v(a,p)), len(v(b,p))) / 2;
  return budget * Math.tan(theta / 2);
}

/**
 * Per-slider ceilings for the current geometry.
 *
 * Rather than re-deriving which vertex takes which radius (a mapping that
 * has to stay in sync with geometry()), ask geometry() for the outline
 * built with a marker value per slider, then read back which vertices
 * carry it. One source of truth.
 */
function radiusLimits(s) {
  // Probe geometry() with a UNIT marker radius on one slider at a time
  // and read back the tightest ceiling among the vertices it owns.
  // The marker is absolute (1.0), never the user's proportion, so the
  // ceiling does not depend on the value we are about to scale by it.
  const lim = { rSquare: Infinity, rDiag: Infinity };

  const probeSq = geometry({ ...s, rSquare: 1, rDiag: 0 });
  probeSq.outerR.forEach((r, i) => {
    if (r > 1e-9) lim.rSquare = Math.min(lim.rSquare, maxRadiusAt(probeSq.outerPts, i) / r);
  });
  if (probeSq.side > 1e-4) {
    lim.rSquare = Math.min(lim.rSquare, maxRadiusAt(probeSq.small, 0));
  }

  const probeD = geometry({ ...s, rSquare: 0, rDiag: 1 });
  probeD.outerR.forEach((r, i) => {
    if (r > 1e-9) lim.rDiag = Math.min(lim.rDiag, maxRadiusAt(probeD.outerPts, i) / r);
  });

  for (const k in lim) if (!isFinite(lim[k]) || lim[k] < 0) lim[k] = 0.5;
  return lim;
}



/* --------------------------------------------------------------------
   THE WORDMARK: the LO mark, then C T T behind it.

   Each letter is drawn into its own unit box, scaled by `wordScale`, and
   laid out left to right with `wordGap` between boxes. The LO keeps the
   full unit height; the CTT sit on the same baseline (bottom-aligned),
   which is what makes them read as following it rather than floating.
-------------------------------------------------------------------- */
function buildWordmark(s) {
  const scale = Math.max(0.05, s.wordScale);
  const gap   = Math.max(0, s.wordGap);

  // translate + scale a subpath's numbers (absolute M/L/A only)
  const place = (d, dx, dy, k) => d.replace(/([MLA])([^MLAZ]*)/gi, (_, cmd, args) => {
    const n = (args.match(/-?\d*\.?\d+(?:e-?\d+)?/g) || []).map(parseFloat);
    const num = x => { const v = Math.abs(x) < 1e-9 ? 0 : x;
      return (v.toFixed(Math.max(0, PREC)).replace(/\.?0+$/, "")) || "0"; };
    if (cmd.toUpperCase() === "A") {
      const out = [];
      for (let i = 0; i + 7 <= n.length; i += 7) {
        const [rx, ry, rot, laf, sf, x, y] = n.slice(i, i + 7);
        out.push(`${num(rx*k)} ${num(ry*k)} ${rot} ${laf} ${sf} ${num(x*k+dx)} ${num(y*k+dy)}`);
      }
      return cmd + out.join(cmd);
    }
    const pairs = [];
    for (let i = 0; i + 1 < n.length; i += 2) pairs.push(`${num(n[i]*k+dx)} ${num(n[i+1]*k+dy)}`);
    return cmd + pairs.join(" ");
  });

  // Keep the pieces separable: the L takes the accent token and the
  // square takes text-primary, so the wordmark cannot be a single path.
  const lo = buildPath(s);
  const C  = letterC(s), T = letterT(s);
  const cD = roundPoly(C.pts, C.r);
  const tD = roundPoly(T.pts, T.r);

  // Every glyph is its own path so each can be coloured, animated or
  // targeted independently. `parts` is the canonical list; `d` is only
  // a convenience for anything that still wants one blob.
  let x = 1 + gap;                           // LO occupies 0..1
  const letters = [];
  for (const [name, d] of [["c", cD], ["t1", tD], ["t2", tD]]) {
    letters.push({ part: name, d: place(d, x, 1 - scale, scale) });  // bottom-aligned
    x += scale + gap;
  }
  const width = x - gap;
  const parts = [
    { part: "l",  d: lo.dL },                    // the L  -> accent
    ...(lo.dSq ? [{ part: "o", d: lo.dSq }] : []), // the square -> text-primary
    ...letters,                                   // c, t1, t2 -> text-primary
  ];
  return {
    parts,
    d: parts.map(p => p.d).join(" "),
    dL: lo.dL, dSq: lo.dSq,
    dCTT: letters.map(p => p.d).join(" "),   // kept: some callers want the trio
    width,
  };
}

/* --------------------------------------------------------------------
   SPINNER ANIMATION

   Four beats, driven by one normalised clock t in 0..1:

     1. SEPARATE + ANTICIPATE (one beat, concurrent)
                   the L slides down-left along the 45deg diagonal and the
                   counter up-right, WHILE the whole group winds slightly
                   BACKWARDS. Parting and winding together read as one
                   gesture -- the shape drawing breath -- rather than two
                   steps in sequence.
     2. HOLD       a brief beat apart at full wind-back, so the recoil
                   registers before the release.
     3. SPIN       forward through `turns` full rotations. The pieces
                   travel back together during this beat, so the collapse
                   and the spin resolve on the same frame.
     4. SETTLE     rotation overshoots past 360 and springs back.

   Separation is measured ALONG the diagonal (unit vector 1/sqrt2), which
   is the same axis the mark's own cut runs on, so the pieces part along
   the shape's grain rather than an arbitrary direction.
-------------------------------------------------------------------- */

/* --------------------------------------------------------------------
   KEYFRAMES WITH EXPLICIT BEZIER HANDLES

   Three keys -- start, peak, end -- for two independent curves. Each
   handle is stated directly rather than derived from a rule, which is
   what removes the old tension: previously exact landings needed
   stationary keyframes, and stationary keyframes read as pauses. Now a
   handle length of 0 gives a true stationary point and anything above 0
   carries momentum through, and you choose which.

   Handles are cubic-bezier control points in segment-local space:
     x = fraction of the SEGMENT'S duration (0..1)
     y = fraction of the SEGMENT'S value change

   At the peak both handles are horizontal (y = 0). That is what pins the
   peak to exactly the amount stated -- a non-zero y there would let the
   curve sail past it -- so only the LENGTH is adjustable.

   At the end, rotation's handle has a free y: a y above 1 overshoots,
   which is how the spring-back is made. Note the consequence -- the
   overshoot is no longer a number you type, it is whatever the handle
   produces. The live readout under the chart reports what you actually
   get.
-------------------------------------------------------------------- */
const ANIM = {
  dur:        1800,
  spread:     0.125,
  turns:      1,
  rest:       0.25,
  rPeakT:     0.3,
  rPeakV:     -22,
  rStartHX:   0.42,
  rStartHY:   0,
  rPeakIn:    0.65,
  rPeakOut:   0.64,
  rOverT:     0.74,
  rOverV:     14,
  rOverIn:    0.45,
  rOverOut:   0.35,
  rEndHX:     0.9,
  sPeakT:     0.25,
  sPeakV:     1,
  sStartHX:   0.55,
  sStartHY:   0,
  sPeakIn:    0.57,
  sPeakOut:   0.42,
  sEndHX:     0.9,
};

const ANIM_DEFAULTS = { ...ANIM };

const ANIM_FIELDS = [
  { sec:"Overall", k:"dur", label:"cycle length", unit:"ms",
    hint:"One full play-through, start to rest.", min:300, max:4000, step:10 },
  { sec:"Overall", k:"spread", label:"gap opened", unit:"\u00D7 width",
    hint:"How far the pieces drift apart at full extension.", min:0, max:1.5, step:0.005 },
  { sec:"Overall", k:"turns", label:"full spins", unit:"turns",
    hint:"Complete forward rotations. Whole numbers only \u2014 a fraction would leave the mark facing a different way than it started.", min:0, max:4, step:1 },
  { sec:"Overall", k:"rest", label:"rest after", unit:"\u00D7 motion",
    hint:"Still time before it loops again.", min:0, max:3, step:0.05 },

  { sec:"Rotation \u2014 start", k:"rStartHX", label:"handle x", unit:"",
    hint:"How far along the first segment the handle reaches. Larger = holds still longer before winding.", min:0, max:1, step:0.01 },
  { sec:"Rotation \u2014 start", k:"rStartHY", label:"handle y", unit:"",

  { sec:"Rotation \u2014 peak", k:"rPeakT", label:"when", unit:"of motion",

  { sec:"Rotation \u2014 peak", k:"rPeakV", label:"amount", unit:"\u00B0",

  { sec:"Rotation \u2014 peak", k:"rPeakIn", label:"handle in", unit:"",

  { sec:"Rotation \u2014 peak", k:"rPeakOut", label:"handle out", unit:"",

  { sec:"Rotation \u2014 overshoot", k:"rOverT", label:"when", unit:"of motion",
    hint:"When it swings furthest past the finish.", min:0.05, max:0.98, step:0.01 },
  { sec:"Rotation \u2014 overshoot", k:"rOverV", label:"amount", unit:"\u00B0 past",
    hint:"How far beyond the finishing angle it goes before springing back. Landed exactly.", min:0, max:60, step:1 },
  { sec:"Rotation \u2014 overshoot", k:"rOverIn", label:"handle in", unit:"",

  { sec:"Rotation \u2014 overshoot", k:"rOverOut", label:"handle out", unit:"",

  { sec:"Rotation \u2014 end", k:"rEndHX", label:"handle x", unit:"",

  { sec:"Separation \u2014 start", k:"sStartHX", label:"handle x", unit:"",
    hint:"Larger = lingers closed before parting.", min:0, max:1, step:0.01 },
  { sec:"Separation \u2014 start", k:"sStartHY", label:"handle y", unit:"",
    hint:"0 = starts from rest.", min:-1, max:1, step:0.01 },

  { sec:"Separation \u2014 peak", k:"sPeakT", label:"when", unit:"of motion",
    hint:"When the pieces are fully apart. Set it slightly before the rotation peak to stop both flattening together.", min:0.03, max:0.9, step:0.01 },
  { sec:"Separation \u2014 peak", k:"sPeakV", label:"amount", unit:"\u00D7 gap",
    hint:"Fraction of the full gap reached. Landed exactly.", min:0, max:1, step:0.01 },
  { sec:"Separation \u2014 peak", k:"sPeakIn", label:"handle in", unit:"",
    hint:"0 = arrives at a dead stop; longer = still opening as it turns.", min:0, max:1, step:0.01 },
  { sec:"Separation \u2014 peak", k:"sPeakOut", label:"handle out", unit:"",
    hint:"0 = pauses at full extension; longer = starts closing at once.", min:0, max:1, step:0.01 },

  { sec:"Separation \u2014 end", k:"sEndHX", label:"handle x", unit:"",
    hint:"How far back the closing handle reaches. Longer = eases shut more gently.", min:0, max:1, step:0.01 },
