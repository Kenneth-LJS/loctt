id: list-create-label
name: Create a label on the fly while adding it
description: K150 - with `--create` / `create_missing` an unknown label is created as `label create` would and attached.
tags: [lists, labels, b45]
pre:
  - entity: { kind: label, name: brand-new, present: false }
cli: set ${task.search_index.key} labels --add brand-new --create
mcp:
  call: { tool: update_task, args: { ref: "${task.search_index.key}", add: { labels: [brand-new] }, create_missing: true } }
capture:
  created: { entity: { kind: label, name: brand-new } }
post:
  - entity: { kind: label, name: brand-new, present: true }
  - field: { task: "${task.search_index.key}", field: labels, equals: ["${label.backend.id}", "${label.infra.id}", "${var.created.id}"] }
