id: upgrade-intentional
name: A 0.1.0 tracker is refused until the user upgrades it, then every link is ranked as it was shown
description: >
  K154 (renamed from upgrade-on-first-use, which asserted K143's automatic
  upgrade): a command on a tracker at format 0.1.0 is refused with the
  upgrade message and changes nothing. Upgrading is a deliberate step
  (`loctt migrate --yes`, MCP `migrate_schema` with confirm), which backs up
  first and runs the 0.1.0 → 0.3.0 step. Every link gets a rank in the
  order 0.1.0 showed it (the check script compares against the frozen
  seed), the retired `ranked` setting is removed, and doctor is as clean as
  the current seed. Starts from the frozen 0.1.0 seed, whose
  ${task.epic_search.key} lists its reranked child first.
tags: [upgrade, b41, b48]
seed: "0.1.0"
pre:
  - yaml: { file: .schema-version, equals: "0.1.0" }
  - yaml: { file: config/workflow.yaml, path: "relationships[key=blocks].ranked", equals: true }
  - relationship_order:
      task: "${task.epic_search.key}"
      type: child
      targets: ["${task.search_typo.key}", "${task.search_index.key}", "${task.search_ui.key}"]
steps:
  - name: a command on the older tracker is refused and changes nothing
    cli: list --limit 1
    mcp:
      call: { tool: list_tasks, args: { limit: 1 } }
    expect_error:
      cli:
        exit_code: 1
        message: "This tracker needs upgrading from 0.1.0 to 0.3.0. Run `loctt migrate` (a backup is made first)."
      mcp:
        message: "This tracker needs upgrading from 0.1.0 to 0.3.0. Run `loctt migrate` (a backup is made first)."
  - name: the user upgrades it on purpose
    cli: migrate --yes
    mcp:
      call: { tool: migrate_schema, args: { confirm: true } }
    post:
      - output: { contains: ["Upgraded this tracker from 0.1.0 to 0.3.0.", ".loctt.backup-v0.1.0-"] }
      - yaml: { file: .schema-version, equals: "0.3.0" }
      - yaml: { file: config/workflow.yaml, path: "relationships[key=blocks].ranked", absent: true }
      - yaml: { file: config/workflow.yaml, path: "relationships[key=parent].ranked", absent: true }
      - relationship_order:
          task: "${task.epic_search.key}"
          type: child
          targets: ["${task.search_typo.key}", "${task.search_index.key}", "${task.search_ui.key}"]
  - name: the command it refused now runs
    cli: list --limit 1
    mcp:
      call: { tool: list_tasks, args: { limit: 1 } }
check_script: upgrade-intentional.check.ts
