id: link-parent
name: Put an existing task under a parent
description: parent on the child, child on the parent.
tags: [links]
cli: link ${task.theme_tokens.key} parent ${task.dark_mode.key}
mcp:
  call: { tool: link_tasks, args: { refs: ["${task.theme_tokens.key}"], type: parent, target: "${task.dark_mode.key}" } }
post:
  - relationship: { task: "${task.theme_tokens.key}", type: parent, target: "${task.dark_mode.key}" }
  - relationship: { task: "${task.dark_mode.key}", type: child, target: "${task.theme_tokens.key}" }
  # The existing relates_to link between them is untouched.
  - relationship: { task: "${task.dark_mode.key}", type: relates_to, target: "${task.theme_tokens.key}" }
