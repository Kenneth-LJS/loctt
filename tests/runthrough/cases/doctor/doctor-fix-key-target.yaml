id: doctor-fix-key-target
name: doctor --fix rewrites a key-valued link target to the id
description: >
  K140's footprint: a link whose target was stored as the key the user
  typed. `doctor --fix` runs every safe repair, which rewrites it to the
  task's id; afterwards doctor reports nothing.
tags: [doctor, links, b39]
setup_patch:
  - file: "tasks/${task.checkout_cart.id}/task.md"
    find: "    target: ${task.epic_checkout.id}\n"
    replace: "    target: ${task.epic_checkout.key}\n"
pre:
  - field: { task: "${task.checkout_cart.key}", field: relationships, contains: { type: parent, target: "${task.epic_checkout.key}", rank: u } }
cli: doctor --fix
mcp:
  call: { tool: doctor, args: { fix: true } }
post:
  - relationship: { task: "${task.checkout_cart.key}", type: parent, target: "${task.epic_checkout.key}" }
  # The rewrite keeps each link's rank (every link has one since K143).
  - field: { task: "${task.checkout_cart.key}", field: relationships, equals: [{ type: parent, target: "${task.epic_checkout.id}", rank: u }, { type: child, target: "${task.cart_totals.id}", rank: u }, { type: child, target: "${task.cart_empty_state.id}", rank: w }] }
  - bilateral: "${task.checkout_cart.key}"
