id: journey-error-delete-needs-yes
name: "Journey: delete will not prompt without a terminal; --yes deletes"
description: >
  Folded in from tests/e2e/10 (B43, K145): a bare `delete` outside a
  terminal refuses (the task stays), `--yes` deletes, and deleting it
  again fails.
tags: [journey, error, b43]
surfaces: [cli]
seed: empty
steps:
  - name: a task
    cli: create doomed
  - name: delete without --yes is refused
    cli: delete T-1
    expect_error:
      cli: { exit_code: 2, message: "non-interactive" }
  - name: the task is still there
    cli: show T-1
    post:
      - output: { contains: ["doomed"] }
  - name: delete --yes
    cli: delete T-1 --yes
    post:
      - task_absent: T-1
  - name: delete it again
    cli: delete T-1 --yes
    expect_error:
      cli: { exit_code: 1, message: "Task not found" }
