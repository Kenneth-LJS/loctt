id: sprint-create
name: Create a sprint
description: A new sprint is stored with its dates, state and goal.
tags: [planning, sprints]
cli: sprint create "Sprint 3" --start 2026-08-31 --end 2026-09-13 --goal "Search MVP"
mcp:
  call: { tool: create_sprint, args: { name: Sprint 3, start_date: "2026-08-31", end_date: "2026-09-13", state: future, goal: Search MVP } }
post:
  - entity: { kind: sprint, name: Sprint 3, fields: { start_date: "2026-08-31", end_date: "2026-09-13", state: future, goal: Search MVP } }
