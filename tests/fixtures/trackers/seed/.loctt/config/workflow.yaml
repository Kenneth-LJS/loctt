key:
  prefix: WEB
statuses:
  - key: backlog
    label: Backlog
    category: pending
    default: true
  - key: in_progress
    label: In progress
    category: active
  - key: done
    label: Done
    category: completed
  - key: wont_do
    label: Won't do
    category: discarded
priorities:
  - key: critical
    label: Critical
    value: 1
  - key: high
    label: High
    value: 2
  - key: medium
    label: Medium
    value: 3
  - key: low
    label: Low
    value: 4
task_types:
  - key: story
    label: Story
  - key: bug
    label: Bug
  - key: task
    label: Task
  - key: spike
    label: Spike
  - key: feature
    label: Feature
relationships:
  - key: blocks
    label: Blocks
    inverse: is_blocked_by
    inverse_label: Is blocked by
    graph: acyclic
    ranked: true
  - key: parent
    label: Parent
    inverse: child
    inverse_label: Child
    graph: tree
    ranked: true
  - key: clones
    label: Clones
    inverse: is_cloned_by
    inverse_label: Is cloned by
  - key: duplicates
    label: Duplicates
    inverse: is_duplicated_by
    inverse_label: Is duplicated by
  - key: causes
    label: Causes
    inverse: is_caused_by
    inverse_label: Is caused by
  - key: relates_to
    label: Relates to
    kind: symmetric
custom_fields:
  - key: team
    label: Team
    type: string
    multi: false
    searchable: true
  - key: risk
    label: Risk
    type: number
    multi: false
    searchable: false
  - key: signed_off
    label: Signed off
    type: boolean
    multi: false
    searchable: false
  - key: review_on
    label: Review on
    type: date
    multi: false
    searchable: false
  - key: area
    label: Area
    type: enum
    multi: false
    searchable: false
    values:
      - key: ui
        label: UI
      - key: api
        label: API
      - key: infra
        label: Infrastructure
      - key: docs
        label: Docs
  - key: platforms
    label: Platforms
    type: enum
    multi: true
    searchable: false
    values:
      - key: ios
        label: iOS
      - key: android
        label: Android
      - key: web
        label: Web
estimation:
  enabled: true
  unit: points
  unit_label: pts
  scale: free
timeline:
  dependency_relationship: blocks
  default_zoom: week
  show_arrows: true
  default_grouping: sprint
