<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline · TaskTracker</title>
    <link rel="stylesheet" href="tokens.css" />
    <script>
      (function () { var t = localStorage.getItem("tt-theme"); if (t === "dark") document.documentElement.classList.add("dark"); })();
    </script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="btn btn--icon btn--ghost" data-action="collapse-sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="header__brand"><span class="header__brand-mark">T</span><span>TaskTracker</span></div>
        <div class="header__spacer"></div>
        <div class="header__actions">
          <input class="input input--search" placeholder="Search tasks…" style="width: 280px;" />
          <div class="theme-toggle" aria-label="Theme"><button data-theme="light" title="Light">☀</button><button data-theme="dark" title="Dark">☾</button></div>
          <button class="btn btn--primary" id="new-task-btn">+ New task</button>
          <button class="avatar avatar--a" data-menu-trigger="user-menu" data-tt-mount="user-avatar" style="border: 0; cursor: pointer;">KL</button>
        </div>
      </header>
      <div class="menu" id="user-menu" style="min-width: 240px;"><div data-tt-mount="user-switcher"></div></div>
      <aside class="sidebar">
        <div class="sidebar__group">
          <a class="sidebar__item" href="list.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span class="sidebar__label">List</span></a>
          <a class="sidebar__item" href="board.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg><span class="sidebar__label">Board</span></a>
          <a class="sidebar__item is-active" href="timeline.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h12M3 12h18M3 18h8"/></svg><span class="sidebar__label">Timeline</span></a>
        </div>
        <div class="sidebar__group"><div class="sidebar__group-label">Projects</div><div data-tt-mount="sidebar-projects"></div></div>
        <div class="sidebar__group"><div class="sidebar__group-label">Saved filters</div><div data-tt-mount="sidebar-builtins"></div><div data-tt-mount="sidebar-views"></div></div>
        <div class="sidebar__group"><div class="sidebar__group-label">Milestones</div><div data-tt-mount="sidebar-milestones"></div></div>
        <div class="sidebar__group"><div class="sidebar__group-label">Sprints</div><div data-tt-mount="sidebar-sprints"></div></div>
        <div class="sidebar__group"><div class="sidebar__group-label">Recently viewed</div><div data-tt-mount="sidebar-recents"></div></div>
        <div class="sidebar__group" style="margin-top: auto;">
          <div data-tt-mount="sidebar-footer"></div>
          <a class="sidebar__item" href="settings.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/></svg><span class="sidebar__label">Settings</span></a>
        </div>
      </aside>
      <main class="main">
        <div class="page">
          <div class="page__title-row">
            <h1 class="page__title">Timeline</h1>
            <div class="page__spacer"></div>
            <div class="row">
              <div class="theme-toggle" style="background: var(--bg-muted);">
                <a href="list.html" style="text-decoration: none;"><button>List</button></a>
                <a href="board.html" style="text-decoration: none;"><button>Board</button></a>
                <button class="is-active">Timeline</button>
              </div>
            </div>
          </div>
          <div data-tt-mount="timeline-view"></div>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script>
      window.TT.views.renderTimeline();
      document.getElementById("new-task-btn").addEventListener("click", () => window.TT.views.openCreateTaskModal());
    </script>
  </body>
</html>
