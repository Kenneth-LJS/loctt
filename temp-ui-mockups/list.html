<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>List view · TaskTracker</title>
    <link rel="stylesheet" href="tokens.css" />
    <script>
      (function () { var t = localStorage.getItem("tt-theme"); if (t === "dark") document.documentElement.classList.add("dark"); })();
    </script>
    <style>
      .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .filter-bar .input { min-width: 240px; }
      .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
      .table thead th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary); background: var(--bg-canvas); padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; position: sticky; top: 0; }
      .dark .table thead th { background: var(--bg-surface); }
      .table thead th .sort { margin-left: 4px; color: var(--text-tertiary); font-size: 10px; }
      .table tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; font-size: 13px; }
      .table tbody tr:hover td { background: var(--bg-muted); }
      .table tbody tr:last-child td { border-bottom: 0; }
      .table .col-key { color: var(--text-tertiary); white-space: nowrap; }
      .table .col-title { font-weight: 500; color: var(--text-primary); min-width: 200px; max-width: 360px; }
      .table .col-title .sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
      .table .col-updated { color: var(--text-tertiary); white-space: nowrap; }
      .table .col-checkbox { width: 32px; }
      .pager { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; font-size: 12px; color: var(--text-tertiary); }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <button class="btn btn--icon btn--ghost" data-action="collapse-sidebar" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="header__brand">
          <span class="header__brand-mark">T</span>
          <span>TaskTracker</span>
        </div>
        <div class="header__spacer"></div>
        <div class="header__actions">
          <input class="input input--search" placeholder="Search tasks…" style="width: 280px;" id="global-search" />
          <div class="theme-toggle" aria-label="Theme">
            <button data-theme="light" title="Light">☀</button>
            <button data-theme="dark" title="Dark">☾</button>
          </div>
          <button class="btn btn--primary" id="new-task-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            New task
          </button>
          <button class="avatar avatar--a" data-menu-trigger="user-menu" data-tt-mount="user-avatar" aria-label="User menu" style="border: 0; cursor: pointer;">KL</button>
        </div>
      </header>

      <div class="menu" id="user-menu" style="min-width: 240px;">
        <div data-tt-mount="user-switcher"></div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__group">
          <a class="sidebar__item is-active" href="list.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            <span class="sidebar__label">List</span>
          </a>
          <a class="sidebar__item" href="board.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg>
            <span class="sidebar__label">Board</span>
          </a>
          <a class="sidebar__item" href="timeline.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h12M3 12h18M3 18h8"/></svg>
            <span class="sidebar__label">Timeline</span>
          </a>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Projects</div>
          <div data-tt-mount="sidebar-projects"></div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Saved filters</div>
          <div data-tt-mount="sidebar-builtins"></div>
          <div data-tt-mount="sidebar-views"></div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Milestones</div>
          <div data-tt-mount="sidebar-milestones"></div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Sprints</div>
          <div data-tt-mount="sidebar-sprints"></div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Labels</div>
          <div data-tt-mount="sidebar-labels"></div>
        </div>

        <div class="sidebar__group">
          <div class="sidebar__group-label">Recently viewed</div>
          <div data-tt-mount="sidebar-recents"></div>
        </div>

        <div class="sidebar__group" style="margin-top: auto;">
          <div data-tt-mount="sidebar-footer"></div>
          <a class="sidebar__item" href="settings.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="sidebar__label">Settings</span>
          </a>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="page">
          <div class="page__title-row">
            <h1 class="page__title">All tasks</h1>
            <div class="page__spacer"></div>
            <div class="row">
              <div class="theme-toggle" style="background: var(--bg-muted);">
                <button class="is-active">List</button>
                <a href="board.html" style="text-decoration: none;"><button>Board</button></a>
                <a href="timeline.html" style="text-decoration: none;"><button>Timeline</button></a>
              </div>
            </div>
          </div>

          <!-- Mount point: list view (filter bar, pills, bulk bar, table, pager) -->
          <div data-tt-mount="list-view" class="col" style="gap: 16px;"></div>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script>
      window.TT.views.renderList();
      document.getElementById("new-task-btn").addEventListener("click", () => window.TT.views.openCreateTaskModal());
      if (new URLSearchParams(window.location.search).get("create") === "1") {
        window.TT.views.openCreateTaskModal();
      }
    </script>
  </body>
</html>
