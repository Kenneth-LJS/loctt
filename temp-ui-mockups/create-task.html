<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create task · TaskTracker</title>
    <link rel="stylesheet" href="tokens.css" />
    <script>
      (function () { var t = localStorage.getItem("tt-theme"); if (t === "dark") document.documentElement.classList.add("dark"); })();
    </script>
    <style>
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
      }
      .dark .backdrop { background: rgba(0, 0, 0, 0.65); }
      body.modal-open .backdrop { display: block; }
      body.modal-open .dialog { display: flex; }
      .dialog { display: none; }
      .toast { display: none; }
      .toast.is-visible { display: flex; }
      .dialog {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        width: 640px;
        max-height: calc(100vh - 128px);
        background: var(--bg-surface-raised);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-overlay);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .dialog__head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dialog__title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        flex: 1;
        margin: 0;
      }
      .dialog__close {
        color: var(--text-tertiary);
        width: 28px;
        height: 28px;
        border-radius: var(--radius-md);
      }
      .dialog__close:hover { background: var(--bg-muted); color: var(--text-primary); }

      .dialog__body {
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field__label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
      .field__hint { font-size: 11px; color: var(--text-tertiary); }
      .field--required .field__label::after { content: " *"; color: var(--feedback-danger-fg); }

      .row-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .input--lg {
        height: 40px;
        padding: 0 12px;
        font-size: 16px;
        font-weight: 500;
      }

      textarea.input {
        height: auto;
        padding: 10px 12px;
        min-height: 120px;
        resize: vertical;
        line-height: 1.5;
      }

      .editor-toolbar { display: flex; gap: 2px; padding: 4px; border: 1px solid var(--border-subtle); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; background: var(--bg-canvas); }
      .dark .editor-toolbar { background: var(--bg-muted); }
      .editor-toolbar .btn { height: 24px; padding: 0 6px; font-size: 12px; color: var(--text-secondary); }
      .editor-body--input {
        border: 1px solid var(--border-subtle);
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        background: var(--bg-surface);
        padding: 12px;
        min-height: 120px;
        font-size: 13px;
        color: var(--text-tertiary);
      }

      .dialog__foot {
        padding: 12px 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-canvas);
      }
      .dark .dialog__foot { background: var(--bg-muted); }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: var(--bg-surface-raised);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-overlay);
        padding: 12px 14px;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        color: var(--text-primary);
        max-width: 360px;
      }
      .toast__icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--feedback-success-bg);
        color: var(--feedback-success-fg);
        display: grid;
        place-items: center;
        font-weight: 700;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <!-- Underlying page (dimmed) -->
    <div class="app">
      <header class="header">
        <button class="btn btn--icon btn--ghost"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="header__brand"><span class="header__brand-mark">T</span><span>TaskTracker</span></div>
        <div class="header__spacer"></div>
        <div class="header__actions">
          <input class="input input--search" placeholder="Search tasks…" style="width: 280px;" />
          <div class="theme-toggle">
            <button data-theme="light">☀</button>
            <button data-theme="dark">☾</button>
          </div>
          <button class="btn btn--primary">+ New task</button>
        </div>
      </header>
      <aside class="sidebar">
        <div class="sidebar__group">
          <a class="sidebar__item is-active" href="list.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span class="sidebar__label">List</span></a>
          <a class="sidebar__item" href="board.html"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg><span class="sidebar__label">Board</span></a>
        </div>
      </aside>
      <main class="main">
        <div class="page">
          <div class="page__title-row">
            <h1 class="page__title">All tasks</h1>
          </div>
          <div style="height: 400px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);"></div>
        </div>
      </main>
    </div>

    <!-- Modal -->
    <div class="backdrop"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dialog__head">
        <h2 class="dialog__title" id="dlg-title">Create task</h2>
        <button class="dialog__close" aria-label="Close">✕</button>
      </div>

      <div class="dialog__body">
        <div class="row-grid">
          <div class="field field--required">
            <label class="field__label">Project</label>
            <select class="select">
              <option value="web" selected>Web (WEB-)</option>
              <option value="backend">Backend (BACKEND-)</option>
              <option value="infra">Infra (INF-)</option>
            </select>
            <div class="field__hint">Next key: <strong>WEB-129</strong>. The project's prefix is immutable.</div>
          </div>
          <div class="field">
            <label class="field__label">Milestone</label>
            <select class="select"><option value="">—</option><option>v1 GA</option><option>v1.1 polish</option></select>
          </div>
        </div>

        <div class="field field--required">
          <label class="field__label">Title</label>
          <input class="input input--lg" placeholder="What needs doing?" autofocus />
        </div>

        <div class="row-grid">
          <div class="field">
            <label class="field__label">Status</label>
            <select class="select">
              <option>○ Not started</option>
              <option>● In progress</option>
              <option>◐ In review</option>
              <option>⚠ Blocked</option>
              <option>✓ Done</option>
              <option>⊘ Won't do</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">Priority</label>
            <select class="select">
              <option>○ Low</option>
              <option selected>● Medium</option>
              <option>● High</option>
              <option>● Critical</option>
            </select>
          </div>
        </div>

        <div class="row-grid">
          <div class="field">
            <label class="field__label">Type</label>
            <select class="select">
              <option>Task</option>
              <option>Bug</option>
              <option>Feature</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">Sprint</label>
            <select class="select">
              <option value="">—</option>
              <option value="s12">S-12 (active)</option>
              <option value="s13">S-13 (future)</option>
            </select>
          </div>
        </div>

        <div class="row-grid">
          <div class="field">
            <label class="field__label">Assignee</label>
            <select class="select">
              <option value="">Unassigned</option>
              <option value="ken">Ken Loh</option>
              <option value="sara">Sara Marquez</option>
              <option value="jess">Jess Park</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">Reporter</label>
            <select class="select">
              <option value="ken" selected>Ken Loh (me)</option>
              <option value="sara">Sara Marquez</option>
              <option value="jess">Jess Park</option>
            </select>
            <div class="field__hint">Defaults to the current user.</div>
          </div>
        </div>

        <div class="field">
          <label class="field__label">Labels</label>
          <div class="row" style="flex-wrap: wrap; gap: 6px; padding: 6px 8px; min-height: 32px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface);">
            <span class="chip">frontend <span class="chip__x">×</span></span>
            <span class="chip">timeline <span class="chip__x">×</span></span>
            <input style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 80px; font-size: 13px;" placeholder="Add a label…" />
          </div>
        </div>

        <div class="row-grid">
          <div class="field">
            <label class="field__label">Start date</label>
            <input class="input" type="date" />
          </div>
          <div class="field">
            <label class="field__label">Due date</label>
            <input class="input" type="date" />
          </div>
        </div>

        <div class="field">
          <label class="field__label">Description</label>
          <div class="editor-toolbar">
            <button class="btn btn--ghost btn--sm">H</button>
            <button class="btn btn--ghost btn--sm" style="font-weight: 700;">B</button>
            <button class="btn btn--ghost btn--sm" style="font-style: italic;">I</button>
            <span style="width: 1px; height: 16px; background: var(--border-subtle); margin: 0 4px;"></span>
            <button class="btn btn--ghost btn--sm">• List</button>
            <button class="btn btn--ghost btn--sm">🔗</button>
            <button class="btn btn--ghost btn--sm">📎</button>
          </div>
          <div class="editor-body--input">Add more detail (optional)…</div>
        </div>
      </div>

      <div class="dialog__foot">
        <label class="chk">
          <input type="checkbox" /><span class="chk__box"></span>
          Create another
        </label>
        <div style="flex: 1;"></div>
        <button class="btn btn--ghost">Cancel</button>
        <button class="btn btn--primary btn--lg">Create task</button>
      </div>
    </div>

    <!-- Success toast (shown when "Create another" was off) -->
    <div class="toast">
      <span class="toast__icon">✓</span>
      <div style="flex: 1;">
        <div style="font-weight: 500;">Task created</div>
        <div style="color: var(--text-tertiary); font-size: 12px;">T-129 · Detect edge-zone hover</div>
      </div>
      <a href="task-detail.html" style="font-size: 12px;">Open</a>
    </div>

    <script src="app.js"></script>
    <script>
      const openBtns = document.querySelectorAll(".btn--primary");
      const createBtn = document.querySelector(".dialog__foot .btn--primary");
      const cancelBtn = document.querySelector(".dialog__foot .btn--ghost");
      const closeBtn = document.querySelector(".dialog__close");
      const backdrop = document.querySelector(".backdrop");
      const anotherChk = document.querySelector(".dialog__foot .chk input");
      const titleInput = document.querySelector(".dialog__body .input--lg");
      const toast = document.querySelector(".toast");

      // Persist "Create another" across page loads
      if (localStorage.getItem("tt-create-another") === "1" && anotherChk) anotherChk.checked = true;
      if (anotherChk) {
        anotherChk.addEventListener("change", () => localStorage.setItem("tt-create-another", anotherChk.checked ? "1" : "0"));
      }

      function open() { document.body.classList.add("modal-open"); setTimeout(() => titleInput && titleInput.focus(), 50); }
      function close() { document.body.classList.remove("modal-open"); }
      function showToast(title) {
        const textTop = toast.querySelector("div > div:first-child");
        const textSub = toast.querySelector("div > div:last-child");
        if (textTop) textTop.textContent = "Task created";
        if (textSub) textSub.textContent = "T-" + Math.floor(100 + Math.random()*900) + " · " + (title || "New task");
        toast.classList.add("is-visible");
        setTimeout(() => toast.classList.remove("is-visible"), 4000);
      }

      // Open on primary CTA — but only the ONE in the underlying app header, not the "Create task" in the dialog foot
      const headerCta = document.querySelector(".header .btn--primary");
      if (headerCta) headerCta.addEventListener("click", (e) => { e.preventDefault(); open(); });

      if (createBtn) createBtn.addEventListener("click", () => {
        const title = titleInput && titleInput.value.trim();
        if (!title) { if (titleInput) titleInput.focus(); return; }
        showToast(title);
        if (anotherChk && anotherChk.checked) {
          // Reset title + body only
          titleInput.value = "";
          titleInput.focus();
        } else {
          close();
        }
      });
      if (cancelBtn) cancelBtn.addEventListener("click", close);
      if (closeBtn) closeBtn.addEventListener("click", close);
      if (backdrop) backdrop.addEventListener("click", close);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("modal-open")) close();
      });

      // Open immediately so the page is useful as a standalone preview
      open();
    </script>
  </body>
</html>
