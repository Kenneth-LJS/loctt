<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create task · TaskTracker</title>
    <link rel="stylesheet" href="tokens.css" />
    <script>
      (function () { var t = localStorage.getItem("tt-theme"); if (t === "dark") document.documentElement.classList.add("dark"); })();
    </script>
  </head>
  <body>
    <!-- Launcher: opens the create-task modal over the list view. -->
    <div class="app">
      <header class="header">
        <div class="header__brand"><span class="header__brand-mark">T</span><span>TaskTracker</span></div>
      </header>
      <main class="main" style="grid-column: 1 / -1;">
        <div class="page">
          <h1 class="page__title">Create task</h1>
          <div class="page__subtitle">The create-task UI is a modal launched from any view. Redirecting…</div>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
    <script src="views.js"></script>
    <script>
      // Open the modal over list view; redirect there so the sidebar shows.
      window.location.replace("list.html?create=1");
    </script>
  </body>
</html>
